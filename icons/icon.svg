<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    
    <!-- Accent / Highlight Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Glass Grid Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#f1f5f9" stop-opacity="0.9" />
    </linearGradient>

    <filter id="dropShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.35" />
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle inner border highlight -->
  <rect x="4" y="4" width="504" height="504" rx="108" fill="none" stroke="#60a5fa" stroke-width="4" stroke-opacity="0.4" />

  <!-- Main Timetable Calendar Container -->
  <g filter="url(#dropShadow)">
    <!-- Base card -->
    <rect x="88" y="104" width="336" height="304" rx="36" fill="url(#cardGrad)" />
    
    <!-- Header banner of the calendar -->
    <path d="M 88 140 C 88 120.1 104.1 104 124 104 L 388 104 C 407.9 104 424 120.1 424 140 L 424 176 L 88 176 Z" fill="#1e40af" />
    
    <!-- Calendar binder rings -->
    <rect x="156" y="80" width="28" height="48" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="4" />
    <rect x="328" y="80" width="28" height="48" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="4" />
    
    <!-- Header title "VITB" -->
    <text x="256" y="152" font-family="'Inter', -apple-system, sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">VIT BHOPAL</text>

    <!-- Schedule Grid Slots -->
    <!-- Row 1 -->
    <rect x="120" y="200" width="80" height="52" rx="12" fill="#dbeafe" />
    <rect x="128" y="210" width="40" height="8" rx="4" fill="#2563eb" />
    <rect x="128" y="226" width="60" height="6" rx="3" fill="#93c5fd" />

    <rect x="216" y="200" width="80" height="52" rx="12" fill="#e0e7ff" />
    <rect x="224" y="210" width="48" height="8" rx="4" fill="#4f46e5" />
    <rect x="224" y="226" width="56" height="6" rx="3" fill="#a5b4fc" />

    <rect x="312" y="200" width="80" height="52" rx="12" fill="#fce7f3" />
    <rect x="320" y="210" width="44" height="8" rx="4" fill="#db2777" />
    <rect x="320" y="226" width="58" height="6" rx="3" fill="#f472b6" />

    <!-- Row 2 -->
    <rect x="120" y="268" width="80" height="52" rx="12" fill="#fef3c7" />
    <rect x="128" y="278" width="50" height="8" rx="4" fill="#d97706" />
    <rect x="128" y="294" width="54" height="6" rx="3" fill="#fcd34d" />

    <rect x="216" y="268" width="80" height="52" rx="12" fill="#dcfce7" />
    <rect x="224" y="278" width="42" height="8" rx="4" fill="#16a34a" />
    <rect x="224" y="294" width="62" height="6" rx="3" fill="#86efac" />

    <rect x="312" y="268" width="80" height="52" rx="12" fill="#ccfbf1" />
    <rect x="320" y="278" width="46" height="8" rx="4" fill="#0d9488" />
    <rect x="320" y="294" width="50" height="6" rx="3" fill="#5eead4" />

    <!-- Bottom Squad Member Avatars Indicator -->
    <g transform="translate(120, 344)">
      <circle cx="16" cy="18" r="14" fill="#3b82f6" stroke="#ffffff" stroke-width="3" />
      <circle cx="38" cy="18" r="14" fill="#10b981" stroke="#ffffff" stroke-width="3" />
      <circle cx="60" cy="18" r="14" fill="#f59e0b" stroke="#ffffff" stroke-width="3" />
      <circle cx="82" cy="18" r="14" fill="#8b5cf6" stroke="#ffffff" stroke-width="3" />
      <text x="110" y="24" font-family="'Inter', -apple-system, sans-serif" font-size="18" font-weight="700" fill="#475569">11 Students</text>
    </g>

    <!-- Floating Live Clock Badge (Bottom Right) -->
    <g transform="translate(320, 320)" filter="url(#glow)">
      <circle cx="48" cy="48" r="42" fill="#2563eb" stroke="#ffffff" stroke-width="5" />
      <!-- Clock Hands -->
      <circle cx="48" cy="48" r="4" fill="#ffffff" />
      <line x1="48" y1="48" x2="48" y2="26" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" />
      <line x1="48" y1="48" x2="64" y2="48" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
    </g>
  </g>
</svg>