<!DOCTYPE html>
<html lang="en">

  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Class Data — VITB Timetable</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            brandBlue: '#2563eb',
            brandBlueHover: '#1d4ed8',
            cardBlue: '#f0f6ff',
            cardBlueBorder: '#dbeafe',
            cardPink: '#fdf2f4',
            cardPinkBorder: '#fce7eb',
            cardNeutral: '#f8fafc',
            cardNeutralBorder: '#e2e8f0',
            tableHeader: '#e8f2fc',
          }
        }
      }
    };
  </script>

  <style>
    /* Mobile-first touch enhancements */
    * {
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    body {
      background-color: #ffffff;
      color: #1e293b;
      font-family: 'Inter', sans-serif;
    }

    /* Clean custom scrollbar for horizontal containers */
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }

    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }

    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }

    /* Left-right horizontal scrollbar for student/squad toggles */
    .custom-h-scrollbar {
      overflow-x: auto;
      scrollbar-width: thin;
      scrollbar-color: #94a3b8 #f1f5f9;
      -webkit-overflow-scrolling: touch;
    }

    .custom-h-scrollbar::-webkit-scrollbar {
      height: 4px;
    }

    .custom-h-scrollbar::-webkit-scrollbar-track {
      background: #f1f5f9;
      border-radius: 9999px;
    }

    .custom-h-scrollbar::-webkit-scrollbar-thumb {
      background: #94a3b8;
      border-radius: 9999px;
    }

    .custom-h-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #64748b;
    }

    .safe-bottom {
      padding-bottom: env(safe-area-inset-bottom, 16px);
    }
  </style>
</head>

<body class="bg-white text-slate-800 antialiased selection:bg-blue-600 selection:text-white">

  <!-- ===================================================================== -->
  <!-- MOBILE PHONE APP CONTAINER (MAX-W-MD)                                  -->
  <!-- ===================================================================== -->
  <div class="max-w-md mx-auto min-h-screen px-4 pt-4 pb-20 flex flex-col">

    <!-- 1. TOP HEADER -->
    <header class="mb-4 text-center">
      <h1 class="text-xl sm:text-2xl font-black tracking-tight text-slate-900">
        Class data
      </h1>

      <!-- Live Now Micro-Banner for Mobile -->
      <div id="liveBannerWidget" class="mt-2 text-xs text-slate-500 flex items-center justify-center gap-2 flex-wrap">
        <!-- Injected dynamically by JS -->
      </div>
    </header>


    <!-- 2. MAIN NAVIGATION TABS (CENTERED PILL STYLE) -->
    <div class="flex justify-center mb-4">
      <div
        class="bg-white border border-slate-200 rounded-full p-1 shadow-sm inline-flex items-center gap-1 overflow-x-auto no-scrollbar max-w-full"
        role="tablist">
        <button onclick="switchTab('master')" id="tabBtn-master"
          class="tab-btn px-3 py-1.5 rounded-full text-xs font-bold transition bg-brandBlue text-white shadow-sm shrink-0">
          Schedule
        </button>
        <button onclick="switchTab('range')" id="tabBtn-range"
          class="tab-btn px-3 py-1.5 rounded-full text-xs font-semibold text-slate-600 hover:text-slate-900 transition shrink-0">
          Free Sorter
        </button>
        <button onclick="switchTab('individual')" id="tabBtn-individual"
          class="tab-btn px-3 py-1.5 rounded-full text-xs font-semibold text-slate-600 hover:text-slate-900 transition shrink-0">
          Individual
        </button>
        <button onclick="switchTab('teacher')" id="tabBtn-teacher"
          class="tab-btn px-3 py-1.5 rounded-full text-xs font-semibold text-slate-600 hover:text-slate-900 transition shrink-0">
          Teacher Finder
        </button>
      </div>
    </div>

    <!-- =================================================================== -->
    <!-- TAB 1: MASTER SCHEDULE (MOBILE OPTIMIZED PHONE VIEW)                -->
    <!-- =================================================================== -->
    <main id="tabPanel-master" class="space-y-4 flex-1">

      <!-- Day Selector Capsule Bar (MON - SAT) -->
      <div class="flex items-center justify-between gap-1 overflow-x-auto pb-1 no-scrollbar">
        <div id="masterDayPills" class="flex items-center gap-1.5 w-full justify-between">
          <!-- Populated by JS: MON, TUE, WED, THU, FRI, SAT -->
        </div>
      </div>

      <!-- Active Squad Quick Filter Strip (Scrollable left to right) -->
      <div class="flex items-center gap-2 text-xs px-1 py-1">
        <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wider shrink-0">Squad:</span>
        <div id="inlineSquadToggles"
          class="flex items-center gap-1.5 overflow-x-auto pb-1.5 flex-nowrap flex-1 custom-h-scrollbar">
          <!-- Injected dynamically by JS -->
        </div>
      </div>

      <!-- Slot Cards List for Selected Day (Clean Mobile Card Feed) -->
      <div id="mobileSlotCardFeed" class="space-y-2.5">
        <!-- Injected dynamically by JS: Slot 1 to 7 with courses, times, venues -->
      </div>

      <!-- Quick Slot Inspector Bottom Sheet / Modal (When a card is tapped) -->
      <div id="slotDetailCard" class="hidden bg-slate-50 border border-slate-200 rounded-2xl p-4 shadow-sm space-y-3">
        <!-- Populated by JS -->
      </div>
    </main>

    <!-- =================================================================== -->
    <!-- TAB 2: FREE BETWEEN X & Y TIME SORTER (MOBILE PHONE OPTIMIZED)       -->
    <!-- =================================================================== -->
    <main id="tabPanel-range" class="hidden space-y-4 flex-1">
      <div class="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm space-y-3">
        <div class="flex items-center justify-between">
          <h2 class="text-sm font-bold text-slate-900 flex items-center gap-1.5">
            <i class="fa-solid fa-clock-rotate-left text-brandBlue"></i>
            <span>Free Time Range Finder</span>
          </h2>
          <button onclick="setRangeToRightNow()"
            class="px-2.5 py-1 rounded-full bg-blue-50 text-brandBlue text-[11px] font-semibold border border-blue-200 active:scale-95 transition">
            <i class="fa-solid fa-bolt mr-1"></i>Next 2 hrs
          </button>
        </div>

        <!-- Day Selection for Range -->
        <div>
          <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1.5">
            Select Day
          </label>
          <div id="rangeDayPills" class="grid grid-cols-6 gap-1 text-center">
            <!-- MON - SAT buttons -->
          </div>
        </div>

        <!-- Time Pickers -->
        <div class="grid grid-cols-2 gap-2.5">
          <div>
            <label for="rangeStartTime"
              class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1">
              Start Time
            </label>
            <input type="time" id="rangeStartTime" value="10:05" min="08:00" max="20:00"
              onchange="calculateAndRenderFreeRange()"
              class="w-full px-3 py-2 rounded-xl bg-slate-50 border border-slate-200 text-xs font-mono font-semibold focus:outline-none focus:border-brandBlue" />
          </div>
          <div>
            <label for="rangeEndTime" class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1">
              End Time
            </label>
            <input type="time" id="rangeEndTime" value="16:20" min="08:00" max="20:00"
              onchange="calculateAndRenderFreeRange()"
              class="w-full px-3 py-2 rounded-xl bg-slate-50 border border-slate-200 text-xs font-mono font-semibold focus:outline-none focus:border-brandBlue" />
          </div>
        </div>

        <!-- Quick Presets -->
        <div>
          <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1.5">
            Quick Time Presets
          </label>
          <div class="flex flex-wrap gap-1.5">
            <button onclick="setTimePreset('08:30', '13:10')"
              class="px-2.5 py-1 rounded-full bg-slate-100 hover:bg-slate-200 text-[11px] font-medium text-slate-700">
              Morning (8:30–13:10)
            </button>
            <button onclick="setTimePreset('13:15', '16:20')"
              class="px-2.5 py-1 rounded-full bg-slate-100 hover:bg-slate-200 text-[11px] font-medium text-slate-700">
              Afternoon (13:15–16:20)
            </button>
            <button onclick="setTimePreset('16:25', '19:30')"
              class="px-2.5 py-1 rounded-full bg-slate-100 hover:bg-slate-200 text-[11px] font-medium text-slate-700">
              Evening (16:25–19:30)
            </button>
            <button onclick="setTimePreset('08:30', '19:30')"
              class="px-2.5 py-1 rounded-full bg-slate-100 hover:bg-slate-200 text-[11px] font-medium text-slate-700">
              Full Day
            </button>
          </div>
        </div>
      </div>

      <!-- Range Results List -->
      <div id="rangeSortedResults" class="space-y-2.5">
        <!-- Injected by JS -->
      </div>
    </main>

    <!-- =================================================================== -->
    <!-- TAB 3: INDIVIDUAL TIMETABLE & REGISTERED COURSES (MOBILE)           -->
    <!-- =================================================================== -->
    <main id="tabPanel-individual" class="hidden space-y-4 flex-1">

      <!-- Friend Selector Pills (Scrollable left to right) -->
      <div class="bg-white border border-slate-200 rounded-2xl p-3 shadow-sm flex items-center gap-2">
        <span class="text-[11px] font-bold uppercase tracking-wider text-slate-400 shrink-0">Student:</span>
        <div id="individualFriendSelector"
          class="flex items-center gap-1.5 overflow-x-auto pb-1 flex-nowrap flex-1 custom-h-scrollbar">
          <!-- Populated by JS: Dhruba / Ajay / Siddhartha / Jaivardhan / Siddhant / Anand / Aravind / Judwe / Subho -->
        </div>
      </div>

      <!-- Individual Stats 2x2 Grid -->
      <div id="individualStatsRow" class="grid grid-cols-2 gap-2">
        <!-- Injected dynamically by JS -->
      </div>

      <!-- Registered Courses Container (Styled Exactly Like Portfolio Table) -->
      <div class="bg-white border border-slate-200 rounded-2xl overflow-hidden shadow-sm">
        <!-- Table Header (Portfolio Baby Blue Strip) -->
        <div class="bg-tableHeader px-3.5 py-2.5 border-b border-blue-100 flex items-center justify-between">
          <span class="text-[10px] font-extrabold uppercase tracking-wider text-slate-600">
            Registered Courses (No Status Row)
          </span>
          <span id="individualCourseCountBadge"
            class="text-[10px] font-mono font-bold text-brandBlue bg-white px-2 py-0.5 rounded-full shadow-2xs">
            9 Courses
          </span>
        </div>

        <!-- Mobile Clean Course Feed -->
        <div id="individualCourseCardsFeed" class="divide-y divide-slate-100 p-2 space-y-1">
          <!-- Injected dynamically by JS (Clean, without the useless status row!) -->
        </div>
      </div>
    </main>

    <!-- =================================================================== -->
    <!-- TAB 4: TEACHER FINDER (FACULTY & STUDENT SEARCH)                    -->
    <!-- =================================================================== -->
    <main id="tabPanel-teacher" class="hidden space-y-4 flex-1">
      <!-- Search & Suggestions Card -->
      <div class="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm space-y-3">
        <div class="flex items-center justify-between">
          <h2 class="text-sm font-bold text-slate-900 flex items-center gap-2">
            <i class="fa-solid fa-chalkboard-user text-brandBlue"></i>
            <span>Teacher Finder</span>
          </h2>
          <span id="teacherCountBadge"
            class="text-[10px] font-mono font-bold text-brandBlue bg-blue-50 border border-blue-100 px-2 py-0.5 rounded-full">
            21 Teachers
          </span>
        </div>

        <p class="text-xs text-slate-500">
          Search any teacher to see which students have classes with them.
        </p>

        <!-- Search Bar -->
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
            <i class="fa-solid fa-magnifying-glass text-xs"></i>
          </div>
          <input type="text" id="teacherSearchInput" placeholder="Search teacher (e.g. Vinod, Kannan, Abdur)..."
            oninput="handleTeacherSearchInput(this.value)"
            class="w-full pl-8 pr-8 py-2 rounded-xl bg-slate-50 border border-slate-200 text-xs font-semibold focus:outline-none focus:border-brandBlue focus:bg-white transition"
            autocomplete="off" />
          <button id="clearTeacherSearchBtn" onclick="clearTeacherSearch()"
            class="hidden absolute inset-y-0 right-0 pr-2.5 flex items-center text-slate-400 hover:text-slate-600"
            title="Clear search">
            <i class="fa-solid fa-circle-xmark text-xs"></i>
          </button>
        </div>
      </div>

      <!-- Search Results Area -->
      <div id="teacherSearchResults" class="space-y-3">
        <!-- Populated dynamically by JS -->
      </div>
    </main>


    <!-- Mobile Footer Info -->
    <footer class="mt-8 text-center text-[11px] text-slate-400">
      <div>VIT Bhopal Slot System</div>
    </footer>

  </div>

    /**
     * ========================================================================
     * 4. HELPER UTILITIES
     * ========================================================================
     */
    function getISTTime() {
      const now = new Date();
      try {
        const istString = now.toLocaleString("en-US", { timeZone: "Asia/Kolkata" });
        const istDate = new Date(istString);
        const jsDay = istDate.getDay();
        const hours = istDate.getHours();
        const minutes = istDate.getMinutes();
        return { jsDay, hours, minutes, currentMins: hours * 60 + minutes };
      } catch (e) {
        const utcMs = now.getTime() + (now.getTimezoneOffset() * 60000);
        const istDate = new Date(utcMs + (5.5 * 3600000));
        const jsDay = istDate.getDay();
        const hours = istDate.getHours();
        const minutes = istDate.getMinutes();
        return { jsDay, hours, minutes, currentMins: hours * 60 + minutes };
      }
    }
    function getFriendSlotMap(friend) {
      const map = {};
      if (!friend || !friend.courses) return map;
      for (const course of friend.courses) {
        for (const slot of course.slots) {
          map[slot.trim().toUpperCase()] = course;
        }
      }
      return map;
    }

    function timeStrToMinutes(timeStr) {
      if (!timeStr || !timeStr.includes(":")) return 0;
      const [h, m] = timeStr.split(":").map(Number);
      return h * 60 + m;
    }

    function minutesToTimeStr(totalMinutes) {
      const h = Math.floor(totalMinutes / 60);
      const m = Math.round(totalMinutes % 60);
      return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}`;
    }

    function formatDuration(mins) {
      if (mins <= 0) return "0m";
      const h = Math.floor(mins / 60);
      const m = Math.round(mins % 60);
      if (h > 0 && m > 0) return `${h}h ${m}m`;
      if (h > 0) return `${h}h`;
      return `${m}m`;
    }

    function getActiveFriendsList() {
      return FRIENDS_DATA.filter(f => activeFriendIds.has(f.id));
    }

    function getSlotOccupancy(day, colIndex) {
      const col = TIME_COLUMNS[colIndex];
      const slotCode = DAY_MATRIX[day][colIndex];
      const activeFriends = getActiveFriendsList();

      const freeFriends = [];
      const busyFriends = [];

      for (const friend of activeFriends) {
        const slotMap = getFriendSlotMap(friend);
        const course = slotMap[slotCode];
        if (course) {
          busyFriends.push({ friend, course });
        } else {
          freeFriends.push(friend);
        }
      }

      return {
        day,
        colIndex,
        slotCode,
        timeRange: `${col.start} - ${col.end}`,
        start: col.start,
        end: col.end,
        label: col.label,
        freeFriends,
        busyFriends
      };
    }

      const totalEl = document.getElementById("statTotalSlots");
      const busyEl = document.getElementById("statBusySlots");
      const freeEl = document.getElementById("statFreeSlots");
      if (!totalEl || !busyEl || !freeEl) return;

      const totalWeekSlots = 42; // 6 days * 7 slots
      const activeFriends = getActiveFriendsList();

      if (activeFriends.length === 0) {
        totalEl.textContent = "42";
        busyEl.textContent = "0";
        freeEl.textContent = "42";
        return;
      }

      // Calculate unique busy slots across active friends
      let busyCount = 0;
      DAYS_ORDER.forEach(day => {
        for (let i = 0; i < 7; i++) {
          const occ = getSlotOccupancy(day, i);
          if (occ.busyFriends.length > 0) {
            busyCount++;
          }
        }
      });

      const freeCount = totalWeekSlots - busyCount;
      totalEl.textContent = totalWeekSlots;
      busyEl.textContent = busyCount;
      freeEl.textContent = freeCount;
    }

    function calculateAndRenderFreeRange() {
      const startStr = document.getElementById("rangeStartTime").value || "08:30";
      const endStr = document.getElementById("rangeEndTime").value || "13:10";
      let startMin = timeStrToMinutes(startStr);
      let endMin = timeStrToMinutes(endStr);
      const resultsContainer = document.getElementById("rangeSortedResults");

      if (endMin <= startMin) {
        resultsContainer.innerHTML = `
          <div class="p-4 rounded-2xl bg-rose-50 text-rose-600 text-xs font-semibold text-center border border-rose-200">
            End Time must be later than Start Time.
          </div>
        `;
        return;
      }

      const totalWindowMinutes = endMin - startMin;
      const daySlots = DAY_MATRIX[selectedRangeDay];

      // Identify which slots overlap
      const overlappingCols = [];
      TIME_COLUMNS.forEach((col, idx) => {
        const overlapStart = Math.max(startMin, col.startMin);
        const overlapEnd = Math.min(endMin, col.endMin);
        const overlapMins = Math.max(0, overlapEnd - overlapStart);
        if (overlapMins > 0) {
          overlappingCols.push({
            col,
            slotCode: daySlots[idx],
            overlapStart,
            overlapEnd,
            overlapMins
          });
        }
      });

      const activeFriends = getActiveFriendsList();
      const friendEvaluations = activeFriends.map(friend => {
        const slotMap = getFriendSlotMap(friend);
        let busyMinutes = 0;
        const busyConflicts = [];
        const freeSlotsInWindow = [];

        for (const item of overlappingCols) {
          const course = slotMap[item.slotCode];
          if (course) {
            busyMinutes += item.overlapMins;
            busyConflicts.push({
              slotCode: item.slotCode,
              course,
              slotStartStr: item.col.start,
              slotEndStr: item.col.end,
              overlapMins: item.overlapMins
            });
          } else {
            freeSlotsInWindow.push({
              slotCode: item.slotCode,
              slotStartStr: item.col.start,
              slotEndStr: item.col.end
            });
          }
        }

        const freeMinutes = Math.max(0, totalWindowMinutes - busyMinutes);
        const freePercent = Math.round((freeMinutes / totalWindowMinutes) * 100);

        return {
          friend,
          freeMinutes,
          busyMinutes,
          freePercent,
          busyConflicts,
          freeSlotsInWindow
        };
      });

      friendEvaluations.sort((a, b) => b.freeMinutes - a.freeMinutes);

      resultsContainer.innerHTML = `
        <div class="text-[11px] font-bold text-slate-400 uppercase tracking-wider px-1">
          Availability Rankings (${selectedRangeDay} • ${startStr} to ${endStr})
        </div>
        ${friendEvaluations.map((item, idx) => `
          <div class="bg-white border border-slate-200 rounded-2xl p-3.5 shadow-2xs space-y-2.5">
            <div class="flex items-center justify-between">
              <div>
                <div class="font-bold text-slate-900 text-sm flex items-center gap-1.5">
                  <span>#${idx + 1}</span>
                  <span>${item.friend.name}</span>
                </div>
                <div class="text-[11px] text-slate-500 font-mono">
                  Free: <strong class="text-brandBlue">${formatDuration(item.freeMinutes)}</strong> of ${formatDuration(totalWindowMinutes)}
                </div>
              </div>
              <span class="px-2.5 py-1 rounded-full text-xs font-bold font-mono ${item.freePercent === 100 ? 'bg-emerald-100 text-emerald-800' : (item.freePercent > 0 ? 'bg-amber-100 text-amber-800' : 'bg-rose-100 text-rose-800')
        }">
                ${item.freePercent}% Free
              </span>
            </div>

            <!-- Progress Bar -->
            <div class="w-full h-2 rounded-full bg-slate-100 overflow-hidden">
              <div class="h-full bg-brandBlue transition-all duration-300" style="width: ${item.freePercent}%"></div>
            </div>

            <!-- Details -->
            ${item.busyConflicts.length > 0 ? `
              <div class="pt-2 border-t border-slate-100 text-[11px] text-slate-500 space-y-1">
                <span class="font-bold text-slate-600">Conflicts in window:</span>
                ${item.busyConflicts.map(c => `
                  <div class="flex items-center justify-between bg-slate-50 px-2 py-1 rounded-lg">
                    <span><strong class="font-mono text-rose-600">${c.slotCode}</strong> (${c.course.code})</span>
                    <span class="font-mono font-semibold text-amber-700">${c.course.venue}</span>
                  </div>
                `).join("")}
              </div>
            ` : `
              <div class="text-[11px] text-emerald-700 font-medium">
                <i class="fa-solid fa-check mr-1"></i>No class conflicts in this time window!
              </div>
            `}
          </div>
        `).join("")}
      `;
    }

    /**
     * ========================================================================
     * 9. TAB 3: INDIVIDUAL TIMETABLE & REGISTERED COURSES (NO STATUS ROW)
     * ========================================================================
     */
    function renderIndividualView() {
      const friend = FRIENDS_DATA.find(f => f.id === selectedIndividualFriendId) || FRIENDS_DATA[0];
      const slotMap = getFriendSlotMap(friend);

      // Render Friend Selector Buttons
      const selectorContainer = document.getElementById("individualFriendSelector");
      selectorContainer.innerHTML = FRIENDS_DATA.map(f => {
        const isSelected = f.id === friend.id;
        return `
          <button
            onclick="selectIndividualFriend('${f.id}')"
            class="shrink-0 whitespace-nowrap px-3.5 py-1 rounded-full text-xs font-bold transition border ${isSelected
            ? 'bg-brandBlue text-white border-brandBlue shadow-2xs'
            : 'bg-slate-100 text-slate-600 border-slate-200 hover:bg-slate-200'
          }"
          >
            ${f.name.split(" ")[0]}
          </button>
        `;
      }).join("");

      // Stats 2x2 Grid
      const totalCourses = friend.courses.length;
      const totalCredits = friend.courses.reduce((sum, c) => sum + Number(c.credit || 0), 0);
      const registeredSlotCount = Object.keys(slotMap).length;
      const totalWeekSlots = 42;
      const freeSlotCount = totalWeekSlots - registeredSlotCount;

      document.getElementById("individualStatsRow").innerHTML = `
        <div class="bg-cardBlue border border-cardBlueBorder p-3 rounded-2xl text-center">
          <div class="text-[10px] font-semibold text-slate-500 uppercase tracking-wider">Courses &amp; Credits</div>
          <div class="text-lg font-black font-mono text-slate-900 mt-0.5">${totalCourses} • ${totalCredits.toFixed(1)} Cr</div>
        </div>
        <div class="bg-cardPink border border-cardPinkBorder p-3 rounded-2xl text-center">
          <div class="text-[10px] font-semibold text-slate-500 uppercase tracking-wider">Weekly Busy</div>
          <div class="text-lg font-black font-mono text-slate-900 mt-0.5">${registeredSlotCount} / 42 Slots</div>
        </div>
      `;

      document.getElementById("individualCourseCountBadge").textContent = `${totalCourses} Courses`;

      // Render Registered Courses List - Clean mobile card items WITHOUT status row!
      const cardsFeed = document.getElementById("individualCourseCardsFeed");
      cardsFeed.innerHTML = friend.courses.map((c, i) => `
        <div class="p-3 bg-white hover:bg-slate-50 transition rounded-xl space-y-1.5">
          <div class="flex items-start justify-between gap-2">
            <div>
              <div class="flex items-center gap-1.5 flex-wrap">
                <span class="font-mono font-bold text-xs px-2 py-0.5 rounded-md bg-blue-50 text-brandBlue">
                  ${c.code}
                </span>
                <span class="font-mono text-[10px] font-bold px-1.5 py-0.5 rounded bg-slate-100 text-slate-600">
                  ${c.shortType}
                </span>
                <span class="font-mono text-[10px] font-bold px-1.5 py-0.5 rounded bg-slate-100 text-slate-600">
                  ${c.credit} Cr
                </span>
              </div>
              <h4 class="text-xs font-bold text-slate-900 mt-1">
                ${c.title}
              </h4>
            </div>
            <div class="text-right shrink-0">
              <span class="font-mono font-extrabold text-xs px-2 py-1 rounded-lg bg-amber-100 text-amber-800">
                ${c.venue}
              </span>
            </div>
          </div>

          <div class="flex items-center justify-between text-[11px] text-slate-500 pt-1 border-t border-slate-100">
            <span class="truncate"><i class="fa-solid fa-user-tie text-slate-400 mr-1"></i>${c.faculty}</span>
            <span class="font-mono font-bold text-brandBlue shrink-0 ml-2">Slots: ${c.slots.join("+")}</span>
          </div>
        </div>
      `).join("");
    }

    function selectIndividualFriend(friendId) {
      selectedIndividualFriendId = friendId;
      renderIndividualView();
    }

    /**
     * ========================================================================
     * 10. SQUAD TOGGLE HELPERS
     * ========================================================================
     */
    function selectSquadFilter(key) {
      if (key === "all") {
        activeFriendIds = new Set(FRIENDS_DATA.map(f => f.id));
      } else {
        // If clicking the only currently active individual, toggle back to 'all'
        if (activeFriendIds.size === 1 && activeFriendIds.has(key)) {
          activeFriendIds = new Set(FRIENDS_DATA.map(f => f.id));
        } else {
          activeFriendIds = new Set([key]);
        }
      }
      refreshAllViews();
    }

    function toggleFriendActive(friendId) {
      selectSquadFilter(friendId);
    }

    function setAllFriendsActive(val) {
      selectSquadFilter("all");
    }

    function refreshAllViews() {
      updateTopSummaryMetrics();
      renderLiveStatusBanner();
      renderInlineSquadToggles();
      if (activeTab === "master") {
        renderMasterDayPills();
        renderMobileSlotCards();
      } else if (activeTab === "range") {
        renderRangeDayButtons();
        calculateAndRenderFreeRange();
      } else if (activeTab === "individual") {
        renderIndividualView();
      } else if (activeTab === "teacher") {
        renderTeacherFinder();
      }
    }

    /**
     * ========================================================================
     * 11. TAB 4: TEACHER FINDER
     * ========================================================================
     */
    let teacherSearchQuery = "";
    let selectedTeacherIndex = null;

    function getTeacherDirectory() {
      const teacherMap = new Map();

      FRIENDS_DATA.forEach(friend => {
        friend.courses.forEach(course => {
          const rawFaculty = (course.faculty || "").trim();
          if (!rawFaculty) return;

          if (!teacherMap.has(rawFaculty)) {
            const parts = rawFaculty.split(" - ");
            const teacherName = parts[0]?.trim() || rawFaculty;
            const school = parts[1]?.trim() || "";

            teacherMap.set(rawFaculty, {
              rawFaculty,
              teacherName,
              school,
              studentRecords: {}
            });
          }

          const entry = teacherMap.get(rawFaculty);
          if (!entry.studentRecords[friend.id]) {
            entry.studentRecords[friend.id] = {
              friend,
              courses: []
            };
          }
          entry.studentRecords[friend.id].courses.push(course);
        });
      });

      return Array.from(teacherMap.values()).sort((a, b) => a.teacherName.localeCompare(b.teacherName));
    }

    function handleTeacherSearchInput(val) {
      teacherSearchQuery = (val || "").trim();
      const clearBtn = document.getElementById("clearTeacherSearchBtn");
      if (clearBtn) {
        if (teacherSearchQuery) {
          clearBtn.classList.remove("hidden");
        } else {
          clearBtn.classList.add("hidden");
        }
      }
      renderTeacherFinder();
    }

    function clearTeacherSearch() {
      const input = document.getElementById("teacherSearchInput");
      if (input) input.value = "";
      teacherSearchQuery = "";
      const clearBtn = document.getElementById("clearTeacherSearchBtn");
      if (clearBtn) clearBtn.classList.add("hidden");
      renderTeacherFinder();
    }

    function renderTeacherFinder() {
      const allTeachers = getTeacherDirectory();
      const resultsContainer = document.getElementById("teacherSearchResults");
      const countBadge = document.getElementById("teacherCountBadge");

      if (!resultsContainer) return;

      const q = teacherSearchQuery.toLowerCase();

      // Filter teachers matching query
      const matchingTeachers = allTeachers.filter(t => {
        if (!q) return true;
        const matchesName = t.teacherName.toLowerCase().includes(q);
        const matchesRaw = t.rawFaculty.toLowerCase().includes(q);
        const matchesSchool = t.school.toLowerCase().includes(q);
        const matchesCourse = Object.values(t.studentRecords).some(sr =>
          sr.courses.some(c => c.code.toLowerCase().includes(q) || c.title.toLowerCase().includes(q))
        );
        return matchesName || matchesRaw || matchesSchool || matchesCourse;
      });

      if (countBadge) {
        countBadge.textContent = teacherSearchQuery
          ? `${matchingTeachers.length} of ${allTeachers.length} Teachers`
          : `${allTeachers.length} Teachers`;
      }

      // Render Search Results
      if (matchingTeachers.length === 0) {
        resultsContainer.innerHTML = `
          <div class="bg-white border border-slate-200 rounded-2xl p-6 text-center space-y-2.5 shadow-sm">
            <div class="w-10 h-10 rounded-full bg-slate-100 text-slate-400 mx-auto flex items-center justify-center text-sm">
              <i class="fa-solid fa-user-slash"></i>
            </div>
            <div>
              <h3 class="text-xs font-bold text-slate-800">No Teacher Found</h3>
              <p class="text-[11px] text-slate-500 mt-0.5">
                No faculty matched <strong class="text-slate-700 font-mono">"${teacherSearchQuery}"</strong>.
              </p>
            </div>
            <button
              onclick="clearTeacherSearch()"
              class="px-3 py-1 rounded-full text-xs font-semibold bg-brandBlue text-white hover:bg-brandBlueHover transition shadow-xs"
            >
              Show All Teachers
            </button>
          </div>
        `;
        return;
      }

      resultsContainer.innerHTML = matchingTeachers.map(t => {
        const studentRecords = Object.values(t.studentRecords);
        const enrolledFriendIds = new Set(Object.keys(t.studentRecords));
        const totalFriends = FRIENDS_DATA.length;
        const allEnrolled = enrolledFriendIds.size === totalFriends;

        let matchBadgeHtml = "";
        if (allEnrolled) {
          matchBadgeHtml = `
            <span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-emerald-100 text-emerald-800 border border-emerald-200 shrink-0">
              <i class="fa-solid fa-users mr-1"></i>All Students (${totalFriends})
            </span>
          `;
        } else {
          const names = studentRecords.map(sr => sr.friend.name.split(" ")[0]).join(" & ");
          matchBadgeHtml = `
            <span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-purple-100 text-purple-800 border border-purple-200 shrink-0">
              <i class="fa-solid fa-user-check mr-1"></i>${names} (${studentRecords.length}/${totalFriends})
            </span>
          `;
        }

        // Check if other friends take this course with someone else
        const comparisonNotes = [];
        FRIENDS_DATA.forEach(otherFriend => {
          if (!enrolledFriendIds.has(otherFriend.id)) {
            studentRecords.forEach(sr => {
              sr.courses.forEach(c => {
                const otherCourse = otherFriend.courses.find(oc => oc.code === c.code);
                if (otherCourse) {
                  const otherFacultyShort = otherCourse.faculty.split(" - ")[0];
                  comparisonNotes.push(
                    `<strong>${otherFriend.name}</strong> takes ${otherCourse.code} (${otherCourse.title}) with <strong>${otherFacultyShort}</strong> instead.`
                  );
                }
              });
            });
          }
        });

        return `
          <div class="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm space-y-3">
            <!-- Teacher Header -->
            <div class="flex items-start justify-between gap-2 pb-2.5 border-b border-slate-100">
              <div class="min-w-0">
                <div class="flex items-center gap-1.5 flex-wrap">
                  <h3 class="text-sm font-black text-slate-900 tracking-tight">
                    ${t.teacherName}
                  </h3>
                  ${t.school ? `
                    <span class="text-[10px] font-bold font-mono px-1.5 py-0.5 rounded bg-slate-100 text-slate-600">
                      ${t.school}
                    </span>
                  ` : ''}
                </div>
                <div class="text-[11px] text-slate-400 font-mono truncate mt-0.5">
                  ${t.rawFaculty}
                </div>
              </div>
              ${matchBadgeHtml}
            </div>

            <!-- Student Cards List -->
            <div class="space-y-2">
              <div class="text-[10px] font-bold uppercase tracking-wider text-slate-400">
                Students Enrolled (${studentRecords.length}/${totalFriends}):
              </div>

              ${studentRecords.map(sr => `
                <div class="bg-slate-50 border border-slate-200/80 rounded-xl p-3 space-y-2">
                  <div class="flex items-center justify-between">
                    <div class="flex items-center gap-2">
                      <div class="w-6 h-6 rounded-full bg-gradient-to-tr ${sr.friend.avatarBg} text-white flex items-center justify-center text-[10px] font-bold shadow-xs">
                        ${sr.friend.name.charAt(0)}
                      </div>
                      <div>
                        <div class="text-xs font-bold text-slate-900 leading-none">${sr.friend.name}</div>
                        <div class="text-[10px] text-slate-400 font-mono mt-0.5">${sr.friend.tag}</div>
                      </div>
                    </div>
                    <span class="text-[10px] font-bold px-2 py-0.5 rounded-md bg-white border border-slate-200 text-slate-600 font-mono">
                      ${sr.courses.length} ${sr.courses.length === 1 ? 'course' : 'courses'}
                    </span>
                  </div>

                  <!-- Course pills -->
                  <div class="space-y-1.5 pt-1">
                    ${sr.courses.map(c => `
                      <div class="bg-white border border-slate-200/70 rounded-lg p-2.5 text-xs shadow-2xs">
                        <div class="flex items-start justify-between gap-1">
                          <div>
                            <span class="font-mono font-bold text-brandBlue text-[11px] mr-1">${c.code}</span>
                            <span class="font-bold text-slate-900">${c.title}</span>
                          </div>
                          <span class="font-mono font-bold text-[10px] px-1.5 py-0.5 rounded bg-amber-100 text-amber-800 shrink-0">
                            ${c.venue}
                          </span>
                        </div>
                        <div class="flex items-center justify-between text-[11px] text-slate-500 mt-1 font-mono">
                          <span>Slots: <strong class="text-slate-800">${c.slots.join(", ")}</strong></span>
                          <span>${c.shortType} • ${c.credit} Cr</span>
                        </div>
                      </div>
                    `).join("")}
                  </div>
                </div>
              `).join("")}

              ${comparisonNotes.length > 0 ? `
                <div class="p-2.5 rounded-xl bg-amber-50/70 border border-amber-200/80 text-[11px] text-amber-900 space-y-1">
                  <div class="flex items-center gap-1.5 font-bold">
                    <i class="fa-solid fa-code-compare text-amber-600"></i>
                    <span>Faculty Comparison:</span>
                  </div>
                  ${comparisonNotes.map(note => `<div>• ${note}</div>`).join("")}
                </div>
              ` : ''}
            </div>
          </div>
        `;
      }).join("");
    }

    /**
     * ========================================================================
     * INITIALIZATION
     * ========================================================================
     */
    window.onload = function () {
      updateTopSummaryMetrics();
      renderLiveStatusBanner();
      switchTab("master");
      setInterval(renderLiveStatusBanner, 30000);
    };
  </script>
</body>

</html>
