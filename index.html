<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Class Data — VITB Timetable</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            brandBlue: '#2563eb',
            brandBlueHover: '#1d4ed8',
            cardBlue: '#f0f6ff',
            cardBlueBorder: '#dbeafe',
            cardPink: '#fdf2f4',
            cardPinkBorder: '#fce7eb',
            cardNeutral: '#f8fafc',
            cardNeutralBorder: '#e2e8f0',
            tableHeader: '#e8f2fc',
          }
        }
      }
    };
  </script>

  <script>
    // Immediate theme initialization to prevent flash
    (function () {
      try {
        const savedTheme = localStorage.getItem("vitb_theme");
        const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (savedTheme === "dark" || (!savedTheme && prefersDark)) {
          document.documentElement.classList.add("dark");
        } else {
          document.documentElement.classList.remove("dark");
        }
      } catch (e) { }
    })();
  </script>

  <style>
    /* Mobile-first touch enhancements */
    * {
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    body {
      background-color: #ffffff;
      color: #1e293b;
      font-family: 'Inter', sans-serif;
    }

    html.dark body {
      background-color: #020617;
      color: #f1f5f9;
    }

    /* Clean custom scrollbar for horizontal containers */
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }

    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }

    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }

    html.dark ::-webkit-scrollbar-track {
      background: #0f172a;
    }

    html.dark ::-webkit-scrollbar-thumb {
      background: #334155;
    }

    /* Hide scrollbars / sliders from UI while keeping smooth touch & swipe scrolling active */
    .no-scrollbar::-webkit-scrollbar,
    .custom-h-scrollbar::-webkit-scrollbar {
      display: none;
      width: 0;
      height: 0;
    }

    .no-scrollbar,
    .custom-h-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .safe-bottom {
      padding-bottom: env(safe-area-inset-bottom, 16px);
    }
  </style>
</head>

<body
  class="bg-white dark:bg-slate-950 text-slate-800 dark:text-slate-100 antialiased selection:bg-blue-600 selection:text-white transition-colors duration-200">

  <!-- ===================================================================== -->
  <!-- MOBILE PHONE APP CONTAINER (MAX-W-MD)                                  -->
  <!-- ===================================================================== -->
  <div class="max-w-md mx-auto min-h-screen px-4 pt-4 pb-20 flex flex-col">

    <!-- 1. TOP HEADER -->
    <header class="mb-4 text-center relative">
      <!-- Dark Mode Toggle Button (Top Right) -->
      <button id="themeToggleBtn" onclick="toggleDarkMode()" aria-label="Toggle dark mode"
        class="absolute right-0 top-0 w-8 h-8 rounded-full flex items-center justify-center transition border shadow-xs bg-slate-100 border-slate-200 text-slate-600 hover:text-slate-900 hover:bg-slate-200 dark:bg-slate-800 dark:border-slate-700 dark:text-amber-400 dark:hover:bg-slate-700 active:scale-95">
        <i id="themeToggleIcon" class="fa-solid fa-moon text-xs"></i>
      </button>

      <h1 class="text-xl sm:text-2xl font-black tracking-tight text-slate-900 dark:text-white">
        Class data
      </h1>

      <!-- Live Now Micro-Banner for Mobile -->
      <div id="liveBannerWidget"
        class="mt-2 text-xs text-slate-500 dark:text-slate-400 flex items-center justify-center gap-2 flex-wrap">
        <!-- Injected dynamically by JS -->
      </div>
    </header>


    <!-- 2. MAIN NAVIGATION TABS (CENTERED PILL STYLE) -->
    <div class="flex justify-center mb-4">
      <div
        class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-full p-1 shadow-sm inline-flex items-center gap-1 overflow-x-auto no-scrollbar max-w-full"
        role="tablist">
        <button onclick="switchTab('master')" id="tabBtn-master"
          class="tab-btn px-3 py-1.5 rounded-full text-xs font-bold transition bg-brandBlue text-white shadow-sm shrink-0">
          Schedule
        </button>
        <button onclick="switchTab('individual')" id="tabBtn-individual"
          class="tab-btn px-3 py-1.5 rounded-full text-xs font-semibold text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-100 transition shrink-0">
          Individual
        </button>
        <button onclick="switchTab('teacher')" id="tabBtn-teacher"
          class="tab-btn px-3 py-1.5 rounded-full text-xs font-semibold text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-100 transition shrink-0">
          Teacher Finder
        </button>
      </div>
    </div>

    <!-- =================================================================== -->
    <!-- TAB 1: MASTER SCHEDULE (MOBILE OPTIMIZED PHONE VIEW)                -->
    <!-- =================================================================== -->
    <main id="tabPanel-master" class="space-y-4 flex-1">

      <!-- Day Selector Capsule Bar (MON - SAT) -->
      <div class="flex items-center justify-between gap-1 overflow-x-auto pb-1 no-scrollbar">
        <div id="masterDayPills" class="flex items-center gap-1.5 w-full justify-between">
          <!-- Populated by JS: MON, TUE, WED, THU, FRI, SAT -->
        </div>
      </div>

      <!-- Active Squad Quick Filter Strip (Scrollable left to right, no visible slider) -->
      <div class="px-1 py-0.5">
        <div id="inlineSquadToggles"
          class="flex items-center gap-1.5 overflow-x-auto flex-nowrap no-scrollbar custom-h-scrollbar">
          <!-- Injected dynamically by JS -->
        </div>
      </div>

      <!-- Slot Cards List for Selected Day (Clean Mobile Card Feed) -->
      <div id="mobileSlotCardFeed" class="space-y-2.5">
        <!-- Injected dynamically by JS: Slot 1 to 7 with courses, times, venues -->
      </div>

      <!-- Quick Slot Inspector Bottom Sheet / Modal (When a card is tapped) -->
      <div id="slotDetailCard"
        class="hidden bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 shadow-sm space-y-3">
        <!-- Populated by JS -->
      </div>
    </main>

    <!-- =================================================================== -->
    <!-- TAB 2: INDIVIDUAL TIMETABLE & REGISTERED COURSES (MOBILE)           -->
    <!-- =================================================================== -->
    <main id="tabPanel-individual" class="hidden space-y-4 flex-1">

      <!-- Friend Selector Pills (Scrollable left to right, no visible slider) -->
      <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-2.5 shadow-sm">
        <div id="individualFriendSelector"
          class="flex items-center gap-1.5 overflow-x-auto flex-nowrap no-scrollbar custom-h-scrollbar">
          <!-- Populated by JS -->
        </div>
      </div>

      <!-- Individual Stats 2x2 Grid -->
      <div id="individualStatsRow" class="grid grid-cols-2 gap-2">
        <!-- Injected dynamically by JS -->
      </div>

      <!-- Registered Courses Container (Styled Exactly Like Portfolio Table) -->
      <div
        class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl overflow-hidden shadow-sm">
        <!-- Table Header (Portfolio Baby Blue Strip) -->
        <div
          class="bg-tableHeader dark:bg-slate-800 px-3.5 py-2.5 border-b border-blue-100 dark:border-slate-700 flex items-center justify-between">
          <span class="text-[10px] font-extrabold uppercase tracking-wider text-slate-600 dark:text-slate-300">
            Registered Courses (No Status Row)
          </span>
          <span id="individualCourseCountBadge"
            class="text-[10px] font-mono font-bold text-brandBlue bg-white dark:bg-slate-900 px-2 py-0.5 rounded-full shadow-2xs">
            9 Courses
          </span>
        </div>

        <!-- Mobile Clean Course Feed -->
        <div id="individualCourseCardsFeed" class="divide-y divide-slate-100 dark:divide-slate-800 p-2 space-y-1">
          <!-- Injected dynamically by JS (Clean, without the useless status row!) -->
        </div>
      </div>
    </main>

    <!-- =================================================================== -->
    <!-- TAB 3: TEACHER FINDER (FACULTY & STUDENT SEARCH)                    -->
    <!-- =================================================================== -->
    <main id="tabPanel-teacher" class="hidden space-y-4 flex-1">
      <!-- Search & Suggestions Card -->
      <div
        class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 shadow-sm space-y-3">
        <div class="flex items-center justify-between">
          <h2 class="text-sm font-bold text-slate-900 dark:text-slate-100 flex items-center gap-2">
            <i class="fa-solid fa-chalkboard-user text-brandBlue"></i>
            <span>Teacher Finder</span>
          </h2>
          <span id="teacherCountBadge"
            class="text-[10px] font-mono font-bold text-brandBlue bg-blue-50 dark:bg-blue-950/60 border border-blue-100 dark:border-blue-900/60 px-2 py-0.5 rounded-full">
            21 Teachers
          </span>
        </div>

        <p class="text-xs text-slate-500 dark:text-slate-400">
          Search any teacher to see which students have classes with them.
        </p>

        <!-- Search Bar -->
        <div class="relative">
          <div
            class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400 dark:text-slate-500">
            <i class="fa-solid fa-magnifying-glass text-xs"></i>
          </div>
          <input type="text" id="teacherSearchInput" placeholder="Search teacher (e.g. Vinod, Kannan, Abdur)..."
            oninput="handleTeacherSearchInput(this.value)"
            class="w-full pl-8 pr-8 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500 text-xs font-semibold focus:outline-none focus:border-brandBlue focus:bg-white dark:focus:bg-slate-800 transition"
            autocomplete="off" />
          <button id="clearTeacherSearchBtn" onclick="clearTeacherSearch()"
            class="hidden absolute inset-y-0 right-0 pr-2.5 flex items-center text-slate-400 hover:text-slate-600 dark:hover:text-slate-200"
            title="Clear search">
            <i class="fa-solid fa-circle-xmark text-xs"></i>
          </button>
        </div>
      </div>

      <!-- Search Results Area -->
      <div id="teacherSearchResults" class="space-y-3">
        <!-- Populated dynamically by JS -->
      </div>
    </main>


    <!-- Mobile Footer Info -->
    <footer class="mt-8 text-center text-[11px] text-slate-400 dark:text-slate-500">
      <div>VIT Bhopal Slot System</div>
    </footer>

    // Exactly 7 theory slots per day, lunch row completely removed
    const DAY_MATRIX = {
      MON: ["A11", "B11", "C11", "A21", "A14", "B21", "C21"],

    };

    const DAYS_ORDER = ["MON", "TUE", "WED", "THU", "FRI", "SAT"];
    const DAY_FULL_NAMES = {
      MON: "Monday",
      TUE: "Tuesday",
      WED: "Wednesday",

    /**

     */
    let activeTab = "master";
    let activeFriendIds = new Set(FRIENDS_DATA.map(f => f.id));

    let selectedSlotIndex = null;
    let selectedIndividualFriendId = "dhruba";

    // Detect today's day on startup (IST)
    const { jsDay: currentJsDay } = getISTTime();
    if (currentJsDay >= 1 && currentJsDay <= 6) {
      selectedMasterDay = DAYS_ORDER[currentJsDay - 1];
    }

    /**
     * ========================================================================
     * 4. HELPER UTILITIES
     * ========================================================================
     */
    function getISTTime() {
      const now = new Date();
      try {
        const istString = now.toLocaleString("en-US", { timeZone: "Asia/Kolkata" });
        const istDate = new Date(istString);
        const jsDay = istDate.getDay();
        const hours = istDate.getHours();
        const minutes = istDate.getMinutes();
        return { jsDay, hours, minutes, currentMins: hours * 60 + minutes };
      } catch (e) {
        const utcMs = now.getTime() + (now.getTimezoneOffset() * 60000);
        const istDate = new Date(utcMs + (5.5 * 3600000));
        const jsDay = istDate.getDay();
        const hours = istDate.getHours();
        const minutes = istDate.getMinutes();
        return { jsDay, hours, minutes, currentMins: hours * 60 + minutes };
      }
    }
    function getFriendSlotMap(friend) {
      const map = {};
      if (!friend || !friend.courses) return map;
      for (const course of friend.courses) {
        for (const slot of course.slots) {
          map[slot.trim().toUpperCase()] = course;
        }
      }
      return map;
    }

    function timeStrToMinutes(timeStr) {
      if (!timeStr || !timeStr.includes(":")) return 0;
      const [h, m] = timeStr.split(":").map(Number);
      return h * 60 + m;
    }

    function minutesToTimeStr(totalMinutes) {
      const h = Math.floor(totalMinutes / 60);
      const m = Math.round(totalMinutes % 60);
      return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}`;
    }

    function formatDuration(mins) {
      if (mins <= 0) return "0m";
      const h = Math.floor(mins / 60);
      const m = Math.round(mins % 60);
      if (h > 0 && m > 0) return `${h}h ${m}m`;
      if (h > 0) return `${h}h`;
      return `${m}m`;
    }

    function getActiveFriendsList() {
      return FRIENDS_DATA.filter(f => activeFriendIds.has(f.id));
    }

    function getSlotOccupancy(day, colIndex) {
      const col = TIME_COLUMNS[colIndex];
      const slotCode = DAY_MATRIX[day][colIndex];
      const activeFriends = getActiveFriendsList();

      const freeFriends = [];
      const busyFriends = [];

      for (const friend of activeFriends) {
        const slotMap = getFriendSlotMap(friend);
        const course = slotMap[slotCode];
        if (course) {
          busyFriends.push({ friend, course });
        } else {
          freeFriends.push(friend);
        }
      }

      // Sort in alphabetical order (A to Z) by student name for all slot displays
      busyFriends.sort((a, b) => a.friend.name.localeCompare(b.friend.name));
      freeFriends.sort((a, b) => a.name.localeCompare(b.name));

      return {
        day,
        colIndex,
        slotCode,
        timeRange: `${col.start} - ${col.end}`,
        start: col.start,
        end: col.end,
        label: col.label,
        freeFriends,
        busyFriends
      };
    }

    /**
     * ========================================================================
     * 5. TOP CARDS & LIVE STATUS METRICS
     * ========================================================================
     */
    function updateTopSummaryMetrics() {
      const totalEl = document.getElementById("statTotalSlots");
      const busyEl = document.getElementById("statBusySlots");
      const freeEl = document.getElementById("statFreeSlots");
      if (!totalEl || !busyEl || !freeEl) return;

      const totalWeekSlots = 42; // 6 days * 7 slots
      const activeFriends = getActiveFriendsList();

      if (activeFriends.length === 0) {
        totalEl.textContent = "42";
        busyEl.textContent = "0";
        freeEl.textContent = "42";
        return;
      }

      // Calculate unique busy slots across active friends
      let busyCount = 0;
      DAYS_ORDER.forEach(day => {
        for (let i = 0; i < 7; i++) {
          const occ = getSlotOccupancy(day, i);
          if (occ.busyFriends.length > 0) {
            busyCount++;
          }
        }
      });

      const freeCount = totalWeekSlots - busyCount;
      totalEl.textContent = totalWeekSlots;
      busyEl.textContent = busyCount;
      freeEl.textContent = freeCount;
    }

    function renderLiveStatusBanner() {
      const widget = document.getElementById("liveBannerWidget");
      if (!widget) return;
      const { jsDay, currentMins } = getISTTime();
      const timeFormatted = minutesToTimeStr(currentMins);

      if (jsDay === 0) {
        widget.innerHTML = `
          <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
          <span class="text-slate-600 dark:text-slate-300">Sunday (${timeFormatted}) — No classes today, full free day!</span>
        `;
        return;
      }

      const dayCode = DAYS_ORDER[jsDay - 1];
      const activeCol = TIME_COLUMNS.find(c => currentMins >= c.startMin && currentMins <= c.endMin);

      if (!activeCol) {
        widget.innerHTML = `
          <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
          <span class="font-semibold text-slate-800 dark:text-slate-200">${dayCode} ${timeFormatted}</span>
          <span class="text-slate-400 dark:text-slate-500">• Outside class hours</span>
        `;
        return;
      }

      const occ = getSlotOccupancy(dayCode, activeCol.index);
      const total = occ.freeFriends.length + occ.busyFriends.length;

      widget.innerHTML = `
        <span class="w-2 h-2 rounded-full bg-blue-600 animate-pulse"></span>
        <span class="font-bold text-blue-600 dark:text-blue-400 font-mono">${dayCode} • ${occ.slotCode}</span>
        <span class="text-slate-500 dark:text-slate-400 text-[11px]">(${occ.timeRange})</span>
        <span class="px-2 py-0.5 rounded-full text-[10px] font-bold ${occ.freeFriends.length === total ? 'bg-emerald-100 dark:bg-emerald-950/60 text-emerald-700 dark:text-emerald-300' : 'bg-blue-100 dark:bg-blue-950/60 text-blue-700 dark:text-blue-300'}">
          ${occ.freeFriends.length}/${total} Free Now
        </span>
      `;
    }

          panel.classList.remove("hidden");

        }
      });

      if (tabId === "master") {
        renderMasterDayPills();
        renderMobileSlotCards();
      } else if (tabId === "individual") {

                      <span class="font-mono font-bold text-[11px] px-2 py-0.5 rounded-md bg-amber-100 dark:bg-amber-950/60 text-amber-800 dark:text-amber-300 border dark:border-amber-900/60 shrink-0 mt-0.5">
                        ${course.venue}
                      </span>
                    </div>
                  `).join("")}
                </div>
              ` : ''}

              <!-- Directly show who are free in this slot -->
              ${occ.freeFriends.length > 0 ? `
                <div class="pt-1.5 ${occ.busyFriends.length > 0 ? 'border-t border-slate-100 dark:border-slate-800' : ''}">
                  <div class="flex items-center gap-1.5 flex-wrap">
                    <span class="text-[11px] font-bold text-emerald-700 dark:text-emerald-400 flex items-center gap-1 shrink-0">
                      <i class="fa-solid fa-circle-check text-emerald-500 text-[11px]"></i> Free (${occ.freeFriends.length}):
                    </span>
                    <div class="flex items-center gap-1 flex-wrap">
                      ${occ.freeFriends.map(f => `
                        <span class="px-2 py-0.5 rounded-md bg-emerald-50 dark:bg-emerald-950/50 text-emerald-700 dark:text-emerald-300 border border-emerald-200/80 dark:border-emerald-800/60 text-[11px] font-semibold">
                          ${f.name.split(" ")[0]}
                        </span>
                      `).join("")}
                    </div>
                  </div>
                </div>
              ` : `
                <div class="text-[11px] text-slate-400 dark:text-slate-500 italic pt-0.5 text-center">
                  All active students in class
                </div>
              `}
            </div>
          </div>
        `;
      }).join("");
    }

    function inspectMobileSlot(colIndex) {
      selectedSlotIndex = colIndex;
      renderMobileSlotCards();

      const occ = getSlotOccupancy(selectedMasterDay, colIndex);
      const detailEl = document.getElementById("slotDetailCard");
      detailEl.classList.remove("hidden");

      detailEl.innerHTML = `
        <div class="flex items-center justify-between pb-2 border-b border-slate-200 dark:border-slate-800">
          <div>
            <div class="flex items-center gap-2">
              <span class="font-mono font-black text-base text-brandBlue">${occ.slotCode}</span>
              <span class="font-bold text-sm text-slate-800 dark:text-slate-100">${DAY_FULL_NAMES[selectedMasterDay]}</span>
            </div>
            <div class="text-xs text-slate-500 dark:text-slate-400 font-mono">${occ.timeRange} (90 mins)</div>
          </div>
          <button onclick="document.getElementById('slotDetailCard').classList.add('hidden')" class="w-6 h-6 rounded-full bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-300 dark:hover:bg-slate-700 flex items-center justify-center text-xs">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>

        <div class="space-y-2.5 text-xs">
          ${occ.busyFriends.length > 0 ? `
            <div class="space-y-1.5">
              <div class="font-bold text-slate-700 dark:text-slate-300 flex items-center justify-between">
                <span>In Class (${occ.busyFriends.length})</span>
              </div>
              ${occ.busyFriends.map(({ friend, course }) => `
                <div class="p-2.5 rounded-xl bg-white dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 space-y-1">
                  <div class="flex items-center justify-between font-bold">
                    <span class="text-slate-900 dark:text-slate-100">${friend.name}</span>
                    <span class="font-mono text-amber-700 dark:text-amber-300 bg-amber-50 dark:bg-amber-950/60 border border-amber-200 dark:border-amber-900/60 px-2 py-0.5 rounded text-[11px]">${course.venue}</span>
                  </div>
                  <div class="text-slate-700 dark:text-slate-300 font-mono text-[11px]">${course.code} • ${course.title}</div>
                  <div class="text-[11px] text-slate-500 dark:text-slate-400"><i class="fa-solid fa-user-tie mr-1 text-slate-400 dark:text-slate-500"></i>${course.faculty}</div>
                </div>
              `).join("")}
            </div>
          ` : ''}

          ${occ.freeFriends.length > 0 ? `
            <div class="p-3 rounded-xl bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200/80 dark:border-emerald-900/60 space-y-1.5">
              <div class="font-bold text-emerald-800 dark:text-emerald-300 flex items-center gap-1.5">
                <i class="fa-solid fa-circle-check text-emerald-600 dark:text-emerald-400"></i>
                <span>Free Students (${occ.freeFriends.length}):</span>
              </div>
              <div class="flex items-center gap-1.5 flex-wrap pt-0.5">
                ${occ.freeFriends.map(f => `
                  <span class="px-2.5 py-1 rounded-lg bg-white dark:bg-slate-900 text-emerald-700 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800 text-xs font-bold shadow-2xs">
                    ${f.name}
                  </span>
                `).join("")}
              </div>
            </div>
          ` : `
            <div class="p-2.5 rounded-xl bg-rose-50 dark:bg-rose-950/40 border border-rose-200 dark:border-rose-900/60 text-rose-700 dark:text-rose-400 text-center font-medium">
              No students free during ${occ.slotCode}.
            </div>
          `}
        </div>
      `;

      if (detailEl.scrollIntoView) {
        detailEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }

    /**
     * ========================================================================
     * 8. TAB 2: INDIVIDUAL TIMETABLE & REGISTERED COURSES (NO STATUS ROW)
     * ========================================================================
     */
    function renderIndividualView() {
      const friend = FRIENDS_DATA.find(f => f.id === selectedIndividualFriendId) || FRIENDS_DATA[0];
      const slotMap = getFriendSlotMap(friend);

      // Render Friend Selector Buttons (Sorted alphabetically A to Z)
      const selectorContainer = document.getElementById("individualFriendSelector");
      const sortedFriends = [...FRIENDS_DATA].sort((a, b) => a.name.localeCompare(b.name));
      selectorContainer.innerHTML = sortedFriends.map(f => {
        const isSelected = f.id === friend.id;
        return `
          <button
            onclick="selectIndividualFriend('${f.id}')"
            class="shrink-0 whitespace-nowrap px-3.5 py-1 rounded-full text-xs font-bold transition border ${isSelected
            ? 'bg-brandBlue text-white border-brandBlue shadow-2xs'
            : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 border-slate-200 dark:border-slate-700 hover:bg-slate-200 dark:hover:bg-slate-700'
          }"
          >
            ${f.name.split(" ")[0]}
          </button>
        `;
      }).join("");

      // Stats 2x2 Grid
      const totalCourses = friend.courses.length;
      const totalCredits = friend.courses.reduce((sum, c) => sum + Number(c.credit || 0), 0);
      const registeredSlotCount = Object.keys(slotMap).length;
      const totalWeekSlots = 42;
      const freeSlotCount = totalWeekSlots - registeredSlotCount;

      document.getElementById("individualStatsRow").innerHTML = `
        <div class="bg-cardBlue dark:bg-blue-950/30 border border-cardBlueBorder dark:border-blue-900/40 p-3 rounded-2xl text-center">
          <div class="text-[10px] font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Courses &amp; Credits</div>
          <div class="text-lg font-black font-mono text-slate-900 dark:text-slate-100 mt-0.5">${totalCourses} • ${totalCredits.toFixed(1)} Cr</div>
        </div>
        <div class="bg-cardPink dark:bg-rose-950/30 border border-cardPinkBorder dark:border-rose-900/40 p-3 rounded-2xl text-center">
          <div class="text-[10px] font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Weekly Busy</div>
          <div class="text-lg font-black font-mono text-slate-900 dark:text-slate-100 mt-0.5">${registeredSlotCount} / 42 Slots</div>
        </div>
      `;

      document.getElementById("individualCourseCountBadge").textContent = `${totalCourses} Courses`;

      // Render Registered Courses List - Clean mobile card items WITHOUT status row!
      const cardsFeed = document.getElementById("individualCourseCardsFeed");
      cardsFeed.innerHTML = friend.courses.map((c, i) => `
        <div class="p-3 bg-white dark:bg-slate-900 hover:bg-slate-50 dark:hover:bg-slate-800/60 transition rounded-xl space-y-1.5">
          <div class="flex items-start justify-between gap-2">
            <div>
              <div class="flex items-center gap-1.5 flex-wrap">
                <span class="font-mono font-bold text-xs px-2 py-0.5 rounded-md bg-blue-50 dark:bg-blue-950/60 text-brandBlue">
                  ${c.code}
                </span>
                <span class="font-mono text-[10px] font-bold px-1.5 py-0.5 rounded bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300">
                  ${c.shortType}
                </span>
                <span class="font-mono text-[10px] font-bold px-1.5 py-0.5 rounded bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300">
                  ${c.credit} Cr
                </span>
              </div>
              <h4 class="text-xs font-bold text-slate-900 dark:text-slate-100 mt-1">
                ${c.title}
              </h4>
            </div>
            <div class="text-right shrink-0">
              <span class="font-mono font-extrabold text-xs px-2 py-1 rounded-lg bg-amber-100 dark:bg-amber-950/60 text-amber-800 dark:text-amber-300 border dark:border-amber-900/60">
                ${c.venue}
              </span>
            </div>
          </div>

          <div class="flex items-center justify-between text-[11px] text-slate-500 dark:text-slate-400 pt-1 border-t border-slate-100 dark:border-slate-800">
            <span class="truncate"><i class="fa-solid fa-user-tie text-slate-400 dark:text-slate-500 mr-1"></i>${c.faculty}</span>
            <span class="font-mono font-bold text-brandBlue shrink-0 ml-2">Slots: ${c.slots.join("+")}</span>
          </div>
        </div>
      `).join("");
    }

    function selectIndividualFriend(friendId) {
      selectedIndividualFriendId = friendId;
      renderIndividualView();
    }

    /**
     * ========================================================================
     * 10. SQUAD TOGGLE HELPERS
     * ========================================================================
     */
    function selectSquadFilter(key) {
      if (key === "all") {
        activeFriendIds = new Set(FRIENDS_DATA.map(f => f.id));
      } else {
        // If clicking the only currently active individual, toggle back to 'all'
        if (activeFriendIds.size === 1 && activeFriendIds.has(key)) {
          activeFriendIds = new Set(FRIENDS_DATA.map(f => f.id));
        } else {
          activeFriendIds = new Set([key]);
        }
      }
      refreshAllViews();
    }

    function toggleFriendActive(friendId) {
      selectSquadFilter(friendId);
    }

    function setAllFriendsActive(val) {
      selectSquadFilter("all");
    }

    function refreshAllViews() {
      updateTopSummaryMetrics();
      renderLiveStatusBanner();
      renderInlineSquadToggles();
      if (activeTab === "master") {
        renderMasterDayPills();
        renderMobileSlotCards();
      } else if (activeTab === "individual") {
        renderIndividualView();
      } else if (activeTab === "teacher") {
        renderTeacherFinder();
      }
    }

    /**
     * ========================================================================
     * 10. TAB 3: TEACHER FINDER
     * ========================================================================
     */
    let teacherSearchQuery = "";
    let selectedTeacherIndex = null;

    function getTeacherDirectory() {
      const teacherMap = new Map();

      FRIENDS_DATA.forEach(friend => {
        friend.courses.forEach(course => {
          const rawFaculty = (course.faculty || "").trim();
          if (!rawFaculty) return;

          if (!teacherMap.has(rawFaculty)) {
            const parts = rawFaculty.split(" - ");
            const teacherName = parts[0]?.trim() || rawFaculty;
            const school = parts[1]?.trim() || "";

            teacherMap.set(rawFaculty, {
              rawFaculty,
              teacherName,
              school,
              studentRecords: {}
            });
          }

          const entry = teacherMap.get(rawFaculty);
          if (!entry.studentRecords[friend.id]) {
            entry.studentRecords[friend.id] = {
              friend,
              courses: []
            };
          }
          entry.studentRecords[friend.id].courses.push(course);
        });
      });

      return Array.from(teacherMap.values()).sort((a, b) => a.teacherName.localeCompare(b.teacherName));
    }

    function handleTeacherSearchInput(val) {
      teacherSearchQuery = (val || "").trim();
      const clearBtn = document.getElementById("clearTeacherSearchBtn");
      if (clearBtn) {
        if (teacherSearchQuery) {
          clearBtn.classList.remove("hidden");
        } else {
          clearBtn.classList.add("hidden");
        }
      }
      renderTeacherFinder();
    }

    function clearTeacherSearch() {
      const input = document.getElementById("teacherSearchInput");
      if (input) input.value = "";
      teacherSearchQuery = "";
      const clearBtn = document.getElementById("clearTeacherSearchBtn");
      if (clearBtn) clearBtn.classList.add("hidden");
      renderTeacherFinder();
    }

    function renderTeacherFinder() {
      const allTeachers = getTeacherDirectory();
      const resultsContainer = document.getElementById("teacherSearchResults");
      const countBadge = document.getElementById("teacherCountBadge");

      if (!resultsContainer) return;

      const q = teacherSearchQuery.toLowerCase();

      // Filter teachers matching query
      const matchingTeachers = allTeachers.filter(t => {
        if (!q) return true;
        const matchesName = t.teacherName.toLowerCase().includes(q);
        const matchesRaw = t.rawFaculty.toLowerCase().includes(q);
        const matchesSchool = t.school.toLowerCase().includes(q);
        const matchesCourse = Object.values(t.studentRecords).some(sr =>
          sr.courses.some(c => c.code.toLowerCase().includes(q) || c.title.toLowerCase().includes(q))
        );
        return matchesName || matchesRaw || matchesSchool || matchesCourse;
      });

      if (countBadge) {
        countBadge.textContent = teacherSearchQuery
          ? `${matchingTeachers.length} of ${allTeachers.length} Teachers`
          : `${allTeachers.length} Teachers`;
      }

      // Render Search Results
      if (matchingTeachers.length === 0) {
        resultsContainer.innerHTML = `
          <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-6 text-center space-y-2.5 shadow-sm">
            <div class="w-10 h-10 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-400 dark:text-slate-500 mx-auto flex items-center justify-center text-sm">
              <i class="fa-solid fa-user-slash"></i>
            </div>
            <div>
              <h3 class="text-xs font-bold text-slate-800 dark:text-slate-100">No Teacher Found</h3>
              <p class="text-[11px] text-slate-500 dark:text-slate-400 mt-0.5">
                No faculty matched <strong class="text-slate-700 dark:text-slate-300 font-mono">"${teacherSearchQuery}"</strong>.
              </p>
            </div>
            <button
              onclick="clearTeacherSearch()"
              class="px-3 py-1 rounded-full text-xs font-semibold bg-brandBlue text-white hover:bg-brandBlueHover transition shadow-xs"
            >
              Show All Teachers
            </button>
          </div>
        `;
        return;
      }

      resultsContainer.innerHTML = matchingTeachers.map(t => {
        const studentRecords = Object.values(t.studentRecords).sort((a, b) => a.friend.name.localeCompare(b.friend.name));
        const enrolledFriendIds = new Set(Object.keys(t.studentRecords));
        const totalFriends = FRIENDS_DATA.length;
        const allEnrolled = enrolledFriendIds.size === totalFriends;

        let matchBadgeHtml = "";
        if (allEnrolled) {
          matchBadgeHtml = `
            <span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-emerald-100 dark:bg-emerald-950/50 text-emerald-800 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800 shrink-0">
              <i class="fa-solid fa-users mr-1"></i>All Students (${totalFriends})
            </span>
          `;
        } else {
          const names = studentRecords.map(sr => sr.friend.name.split(" ")[0]).join(" & ");
          matchBadgeHtml = `
            <span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-purple-100 dark:bg-purple-950/50 text-purple-800 dark:text-purple-300 border border-purple-200 dark:border-purple-800 shrink-0">
              <i class="fa-solid fa-user-check mr-1"></i>${names} (${studentRecords.length}/${totalFriends})
            </span>
          `;
        }

        // Collect unique course codes taught by this teacher across enrolled students
        const taughtCourses = new Map();
        studentRecords.forEach(sr => {
          sr.courses.forEach(c => {
            if (!taughtCourses.has(c.code)) {
              taughtCourses.set(c.code, c);
            }
          });
        });

        // Check if other friends take any of these courses with someone else (completely deduplicated)
        const comparisonNotes = [];
        const seenComparisons = new Set();

        FRIENDS_DATA.forEach(otherFriend => {
          taughtCourses.forEach((c, courseCode) => {
            const isEnrolledWithThisTeacher = studentRecords.some(sr =>
              sr.friend.id === otherFriend.id && sr.courses.some(sc => sc.code === courseCode)
            );

            if (!isEnrolledWithThisTeacher) {
              const otherCourse = otherFriend.courses.find(oc => oc.code === courseCode);
              if (otherCourse) {
                const compKey = `${otherFriend.id}-${courseCode}`;
                if (!seenComparisons.has(compKey)) {
                  seenComparisons.add(compKey);
                  const otherFacultyShort = otherCourse.faculty.split(" - ")[0];
                  comparisonNotes.push({
                    friendName: otherFriend.name,
                    courseCode: otherCourse.code,
                    html: `<strong>${otherFriend.name}</strong> takes ${otherCourse.code} (${otherCourse.title}) with <strong>${otherFacultyShort}</strong> instead.`
                  });
                }
              }
            }
          });
        });

        // Sort comparison notes alphabetically by student name, then course code
        comparisonNotes.sort((a, b) => a.friendName.localeCompare(b.friendName) || a.courseCode.localeCompare(b.courseCode));

        return `
          <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 shadow-sm space-y-3">
            <!-- Teacher Header -->
            <div class="flex items-start justify-between gap-2 pb-2.5 border-b border-slate-100 dark:border-slate-800">
              <div class="min-w-0">
                <div class="flex items-center gap-1.5 flex-wrap">
                  <h3 class="text-sm font-black text-slate-900 dark:text-slate-100 tracking-tight">
                    ${t.teacherName}
                  </h3>
                  ${t.school ? `
                    <span class="text-[10px] font-bold font-mono px-1.5 py-0.5 rounded bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300">
                      ${t.school}
                    </span>
                  ` : ''}
                </div>
                <div class="text-[11px] text-slate-400 dark:text-slate-500 font-mono truncate mt-0.5">
                  ${t.rawFaculty}
                </div>
              </div>
              ${matchBadgeHtml}
            </div>

            <!-- Student Cards List -->
            <div class="space-y-2">
              <div class="text-[10px] font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500">
                Students Enrolled (${studentRecords.length}/${totalFriends}):
              </div>

              ${studentRecords.map(sr => `
                <div class="bg-slate-50 dark:bg-slate-800/60 border border-slate-200/80 dark:border-slate-700/60 rounded-xl p-3 space-y-2">
                  <div class="flex items-center justify-between">
                    <div class="flex items-center gap-2">
                      <div class="w-6 h-6 rounded-full bg-gradient-to-tr ${sr.friend.avatarBg} text-white flex items-center justify-center text-[10px] font-bold shadow-xs">
                        ${sr.friend.name.charAt(0)}
                      </div>
                      <div>
                        <div class="text-xs font-bold text-slate-900 dark:text-slate-100 leading-none">${sr.friend.name}</div>
                        <div class="text-[10px] text-slate-400 dark:text-slate-500 font-mono mt-0.5">${sr.friend.tag}</div>
                      </div>
                    </div>
                    <span class="text-[10px] font-bold px-2 py-0.5 rounded-md bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 font-mono">
                      ${sr.courses.length} ${sr.courses.length === 1 ? 'course' : 'courses'}
                    </span>
                  </div>

                  <!-- Course pills -->
                  <div class="space-y-1.5 pt-1">
                    ${sr.courses.map(c => `
                      <div class="bg-white dark:bg-slate-900/90 border border-slate-200/70 dark:border-slate-700/80 rounded-lg p-2.5 text-xs shadow-2xs">
                        <div class="flex items-start justify-between gap-1">
                          <div>
                            <span class="font-mono font-bold text-brandBlue text-[11px] mr-1">${c.code}</span>
                            <span class="font-bold text-slate-900 dark:text-slate-100">${c.title}</span>
                          </div>
                          <span class="font-mono font-bold text-[10px] px-1.5 py-0.5 rounded bg-amber-100 dark:bg-amber-950/60 text-amber-800 dark:text-amber-300 border dark:border-amber-900/60 shrink-0">
                            ${c.venue}
                          </span>
                        </div>
                        <div class="flex items-center justify-between text-[11px] text-slate-500 dark:text-slate-400 mt-1 font-mono">
                          <span>Slots: <strong class="text-slate-800 dark:text-slate-200">${c.slots.join(", ")}</strong></span>
                          <span>${c.shortType} • ${c.credit} Cr</span>
                        </div>
                      </div>
                    `).join("")}
                  </div>
                </div>
              `).join("")}

              ${comparisonNotes.length > 0 ? `
                <div class="p-2.5 rounded-xl bg-amber-50/70 dark:bg-amber-950/30 border border-amber-200/80 dark:border-amber-900/40 text-amber-900 dark:text-amber-200 space-y-1">
                  <div class="flex items-center gap-1.5 font-bold">
                    <i class="fa-solid fa-code-compare text-amber-600 dark:text-amber-400"></i>
                    <span>Faculty Comparison:</span>
                  </div>
                  ${comparisonNotes.map(note => `<div>• ${note.html}</div>`).join("")}
                </div>
              ` : ''}
            </div>
          </div>
        `;
      }).join("");
    }

    /**
     * ========================================================================
     * 11. DARK MODE MANAGEMENT
     * ========================================================================
     */
    function updateThemeToggleIcon() {
      const isDark = document.documentElement.classList.contains("dark");
      const icon = document.getElementById("themeToggleIcon");
      if (icon) {
        icon.className = isDark
          ? "fa-solid fa-sun text-xs text-amber-400"
          : "fa-solid fa-moon text-xs text-slate-600";
      }
    }

    function toggleDarkMode() {
      const root = document.documentElement;
      const isDark = root.classList.toggle("dark");
      try {
        localStorage.setItem("vitb_theme", isDark ? "dark" : "light");
      } catch (e) { }
      updateThemeToggleIcon();
    }

    /**
     * ========================================================================
     * INITIALIZATION
     * ========================================================================
     */
    window.onload = function () {
      updateThemeToggleIcon();
      updateTopSummaryMetrics();
      renderLiveStatusBanner();
      switchTab("master");
      setInterval(renderLiveStatusBanner, 30000);
    };
  </script>
</body>

</html>
