    function getISTTime() {
      const now = new Date();
      try {
        const istString = now.toLocaleString("en-US", { timeZone: "Asia/Kolkata" });
        const istDate = new Date(istString);
        const jsDay = istDate.getDay();
        const hours = istDate.getHours();
        const minutes = istDate.getMinutes();
        return { jsDay, hours, minutes, currentMins: hours * 60 + minutes };
      } catch (e) {
        const utcMs = now.getTime() + (now.getTimezoneOffset() * 60000);
        const istDate = new Date(utcMs + (5.5 * 3600000));
        const jsDay = istDate.getDay();
        const hours = istDate.getHours();
        const minutes = istDate.getMinutes();
        return { jsDay, hours, minutes, currentMins: hours * 60 + minutes };
      }
    }
    function getFriendSlotMap(friend) {
      const map = {};
      if (!friend || !friend.courses) return map;
      for (const course of friend.courses) {
        for (const slot of course.slots) {
          map[slot.trim().toUpperCase()] = course;
        }
      }
      return map;
    }

    function timeStrToMinutes(timeStr) {
      if (!timeStr || !timeStr.includes(":")) return 0;
      const [h, m] = timeStr.split(":").map(Number);
      return h * 60 + m;
    }

    function minutesToTimeStr(totalMinutes) {
      const h = Math.floor(totalMinutes / 60);
      const m = Math.round(totalMinutes % 60);
      return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}`;
    }

    function formatDuration(mins) {
      if (mins <= 0) return "0m";
      const h = Math.floor(mins / 60);
      const m = Math.round(mins % 60);
      if (h > 0 && m > 0) return `${h}h ${m}m`;
      if (h > 0) return `${h}h`;
      return `${m}m`;
    }

    function getActiveFriendsList() {
      return FRIENDS_DATA.filter(f => activeFriendIds.has(f.id));
    }

    function getSlotOccupancy(day, colIndex) {
      const col = TIME_COLUMNS[colIndex];
      const slotCode = DAY_MATRIX[day][colIndex];
      const activeFriends = getActiveFriendsList();

      const freeFriends = [];
      const busyFriends = [];

      for (const friend of activeFriends) {
        const slotMap = getFriendSlotMap(friend);
        const course = slotMap[slotCode];
        if (course) {
          busyFriends.push({ friend, course });
        } else {
          freeFriends.push(friend);
        }
      }

      return {
        day,
        colIndex,
        slotCode,
        timeRange: `${col.start} - ${col.end}`,
        start: col.start,
        end: col.end,
        label: col.label,
        freeFriends,
        busyFriends
      };
    }

    /**
     * ========================================================================
     * 5. TOP CARDS & LIVE STATUS METRICS
     * ========================================================================
     */
    function updateTopSummaryMetrics() {
      const totalEl = document.getElementById("statTotalSlots");
      const busyEl = document.getElementById("statBusySlots");
      const freeEl = document.getElementById("statFreeSlots");
      if (!totalEl || !busyEl || !freeEl) return;

      const totalWeekSlots = 42; // 6 days * 7 slots
      const activeFriends = getActiveFriendsList();

      if (activeFriends.length === 0) {
        totalEl.textContent = "42";
        busyEl.textContent = "0";
        freeEl.textContent = "42";
        return;
      }

      // Calculate unique busy slots across active friends
      let busyCount = 0;
      DAYS_ORDER.forEach(day => {
        for (let i = 0; i < 7; i++) {
          const occ = getSlotOccupancy(day, i);
          if (occ.busyFriends.length > 0) {
            busyCount++;
          }
        }
      });

      const freeCount = totalWeekSlots - busyCount;
      totalEl.textContent = totalWeekSlots;
      busyEl.textContent = busyCount;
      freeEl.textContent = freeCount;
    }

    function renderLiveStatusBanner() {
      const widget = document.getElementById("liveBannerWidget");
      const { jsDay, currentMins } = getISTTime();
      const timeFormatted = minutesToTimeStr(currentMins);

      if (jsDay === 0) {
        widget.innerHTML = `
          <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
          <span>Sunday (${timeFormatted}) — No classes today, full free day!</span>
        `;
        return;
      }

      const dayCode = DAYS_ORDER[jsDay - 1];
      const activeCol = TIME_COLUMNS.find(c => currentMins >= c.startMin && currentMins <= c.endMin);

      if (!activeCol) {
        widget.innerHTML = `
          <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
          <span class="font-semibold text-slate-800">${dayCode} ${timeFormatted}</span>
          <span class="text-slate-400">• Outside class hours</span>
        `;
        return;
      }

      const occ = getSlotOccupancy(dayCode, activeCol.index);
      const total = occ.freeFriends.length + occ.busyFriends.length;

      widget.innerHTML = `
        <span class="w-2 h-2 rounded-full bg-blue-600 animate-pulse"></span>
        <span class="font-bold text-blue-600 font-mono">${dayCode} • ${occ.slotCode}</span>
        <span class="text-slate-500 text-[11px]">(${occ.timeRange})</span>
        <span class="px-2 py-0.5 rounded-full text-[10px] font-bold ${occ.freeFriends.length === total ? 'bg-emerald-100 text-emerald-700' : 'bg-blue-100 text-blue-700'}">
          ${occ.freeFriends.length}/${total} Free Now
        </span>
      `;
    }

    /**
     * ========================================================================
     * 6. NAVIGATION & TABS
     * ========================================================================
     */
    function switchTab(tabId) {
      activeTab = tabId;
      const tabs = ["master", "range", "individual"];

      tabs.forEach(t => {
        const panel = document.getElementById(`tabPanel-${t}`);
        const btn = document.getElementById(`tabBtn-${t}`);
        if (t === tabId) {
          panel.classList.remove("hidden");
          btn.className = "tab-btn px-4 py-1.5 rounded-full text-xs font-bold transition bg-brandBlue text-white shadow-sm";
        } else {
          panel.classList.add("hidden");
          btn.className = "tab-btn px-4 py-1.5 rounded-full text-xs font-semibold text-slate-600 hover:text-slate-900 transition";
        }
      });

      if (tabId === "master") {
        renderMasterDayPills();
        renderMobileSlotCards();
      } else if (tabId === "range") {
        renderRangeDayButtons();
        calculateAndRenderFreeRange();
      } else if (tabId === "individual") {
        renderIndividualView();
      }
    }

    /**
     * ========================================================================
     * 7. TAB 1: MOBILE TIMETABLE FEED & DAY SELECTOR
     * ========================================================================
     */
    function renderMasterDayPills() {
      const container = document.getElementById("masterDayPills");
      container.innerHTML = DAYS_ORDER.map(day => {
        const isSelected = day === selectedMasterDay;
        return `
          <button
            onclick="selectMasterDay('${day}')"
            class="flex-1 py-1.5 px-2 rounded-xl text-xs font-bold transition text-center ${isSelected
            ? 'bg-brandBlue text-white shadow-sm'
            : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
          }"
          >
            ${day}
          </button>
        `;
      }).join("");

      document.getElementById("currentDayHeaderLabel").textContent = DAY_FULL_NAMES[selectedMasterDay];
      renderInlineSquadToggles();
    }

    function selectMasterDay(day) {
      selectedMasterDay = day;
      selectedSlotIndex = null;
      renderMasterDayPills();
      renderMobileSlotCards();
      document.getElementById("slotDetailCard").classList.add("hidden");
    }

    function renderInlineSquadToggles() {
      const container = document.getElementById("inlineSquadToggles");
      container.innerHTML = FRIENDS_DATA.map(f => {
        const active = activeFriendIds.has(f.id);
        return `
          <button
            onclick="toggleFriendActive('${f.id}')"
            class="px-2 py-0.5 rounded-full text-[10px] font-bold border transition ${active
            ? 'bg-blue-50 text-brandBlue border-blue-200'
            : 'bg-slate-50 text-slate-400 border-slate-200 opacity-60'
          }"
          >
            ${f.name.split(" ")[0]}
          </button>
        `;
      }).join("");
    }

    function renderMobileSlotCards() {
      const container = document.getElementById("mobileSlotCardFeed");
      const activeFriends = getActiveFriendsList();

      if (activeFriends.length === 0) {
        container.innerHTML = `
          <div class="p-8 text-center bg-slate-50 rounded-2xl border border-dashed border-slate-200 text-slate-400 text-xs">
            No friends selected in squad. Tap "Squad" at top to enable.
          </div>
        `;
        return;
      }

      // Render 7 slots for the chosen day
      container.innerHTML = TIME_COLUMNS.map((col, idx) => {
        const occ = getSlotOccupancy(selectedMasterDay, idx);
        const total = occ.freeFriends.length + occ.busyFriends.length;
        const allFree = occ.freeFriends.length === total;
        const allBusy = occ.freeFriends.length === 0;

        let badgeStyle = "bg-amber-50 text-amber-700 border-amber-200";
        let statusText = `${occ.freeFriends.length}/${total} Free`;

        if (allFree) {
          badgeStyle = "bg-emerald-50 text-emerald-700 border-emerald-200";
          statusText = "Both Free";
        } else if (allBusy) {
          badgeStyle = "bg-rose-50 text-rose-700 border-rose-200";
          statusText = "Both In Class";
        }

        const isCurrentSlotSelected = selectedSlotIndex === idx;

        return `
          <div
            onclick="inspectMobileSlot(${idx})"
            class="bg-white border rounded-2xl p-3.5 shadow-2xs transition active:scale-[0.99] cursor-pointer ${isCurrentSlotSelected
            ? 'border-brandBlue ring-2 ring-blue-100'
            : 'border-slate-200/90 hover:border-slate-300'
          }"
          >
            <!-- Card Header: Slot Name + Time + Status Badge -->
            <div class="flex items-center justify-between gap-2 mb-2 pb-2 border-b border-slate-100">
              <div class="flex items-center gap-2">
                <span class="font-mono font-black text-sm px-2 py-0.5 rounded-lg bg-slate-100 text-slate-800">
                  ${occ.slotCode}
                </span>
                <span class="text-xs font-semibold text-slate-500 font-mono">
                  ${col.start} – ${col.end}
                </span>
              </div>
              <span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold border ${badgeStyle}">
                ${statusText}
              </span>
            </div>

            <!-- Card Body: Busy/Free Course Information -->
            <div class="space-y-1.5">
              ${occ.busyFriends.length > 0
            ? occ.busyFriends.map(({ friend, course }) => `
                    <div class="flex items-center justify-between text-xs py-1 px-2 rounded-xl bg-slate-50">
                      <div class="min-w-0 pr-2">
                        <div class="font-bold text-slate-900 truncate">
                          ${friend.name.split(" ")[0]}: <span class="text-brandBlue font-mono">${course.code}</span>
                        </div>
                        <div class="text-[11px] text-slate-500 truncate">
                          ${course.title} • <span class="font-medium text-slate-600">${course.faculty.split(" - ")[0]}</span>
                        </div>
                      </div>
                      <span class="font-mono font-bold text-[11px] px-2 py-0.5 rounded-md bg-amber-100 text-amber-800 shrink-0">
                        ${course.venue}
                      </span>
                    </div>
                  `).join("")
            : `
                    <div class="py-1.5 px-2 rounded-xl bg-emerald-50/60 text-emerald-700 text-xs font-medium flex items-center gap-2">
                      <i class="fa-solid fa-circle-check text-emerald-500"></i>
                      <span>Free slot! Perfect time to hang out or study.</span>
                    </div>
                  `
          }
            </div>
          </div>
        `;
      }).join("");
    }

    function inspectMobileSlot(colIndex) {
      selectedSlotIndex = colIndex;
      renderMobileSlotCards();

      const occ = getSlotOccupancy(selectedMasterDay, colIndex);
      const detailEl = document.getElementById("slotDetailCard");
      detailEl.classList.remove("hidden");

      detailEl.innerHTML = `
        <div class="flex items-center justify-between pb-2 border-b border-slate-200">
          <div>
            <div class="flex items-center gap-2">
              <span class="font-mono font-black text-base text-brandBlue">${occ.slotCode}</span>
              <span class="font-bold text-sm text-slate-800">${DAY_FULL_NAMES[selectedMasterDay]}</span>
            </div>
            <div class="text-xs text-slate-500 font-mono">${occ.timeRange} (90 mins)</div>
          </div>
          <button onclick="document.getElementById('slotDetailCard').classList.add('hidden')" class="w-6 h-6 rounded-full bg-slate-200 text-slate-600 flex items-center justify-center text-xs">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>

        <div class="space-y-2 text-xs">
          ${occ.busyFriends.length > 0 ? `
            <div class="font-bold text-slate-700">Class Details:</div>
            ${occ.busyFriends.map(({ friend, course }) => `
              <div class="p-2.5 rounded-xl bg-white border border-slate-200 space-y-1">
                <div class="flex items-center justify-between font-bold">
                  <span>${friend.name}</span>
                  <span class="font-mono text-amber-600">${course.venue}</span>
                </div>
                <div class="text-slate-600 font-mono">${course.code} • ${course.title}</div>
                <div class="text-[11px] text-slate-500"><i class="fa-solid fa-user-tie mr-1"></i>${course.faculty}</div>
              </div>
            `).join("")}
          ` : `
            <div class="p-3 text-center text-emerald-700 font-medium bg-emerald-50 rounded-xl">
              Nobody in class during ${occ.slotCode}! Both Dhruba and Ajay are free.
            </div>
          `}
        </div>
      `;

      detailEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    /**
     * ========================================================================
     * 8. TAB 2: FREE BETWEEN X & Y TIME (MOBILE SORTER)
     * ========================================================================
     */
    function renderRangeDayButtons() {
      const container = document.getElementById("rangeDayPills");
      container.innerHTML = DAYS_ORDER.map(day => {
        const active = day === selectedRangeDay;
        return `
          <button
            onclick="selectRangeDay('${day}')"
            class="py-1.5 rounded-xl font-bold text-xs transition ${active
            ? 'bg-brandBlue text-white shadow-xs'
            : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
          }"
          >
            ${day}
          </button>
        `;
      }).join("");
    }

    function selectRangeDay(day) {
      selectedRangeDay = day;
      renderRangeDayButtons();
      calculateAndRenderFreeRange();
    }

    function setTimePreset(startStr, endStr) {
      document.getElementById("rangeStartTime").value = startStr;
      document.getElementById("rangeEndTime").value = endStr;
      calculateAndRenderFreeRange();
    }

    function setRangeToRightNow() {
      const { jsDay, currentMins } = getISTTime();
      if (jsDay >= 1 && jsDay <= 6) {
        selectedRangeDay = DAYS_ORDER[jsDay - 1];
      }
      let startM = currentMins;
      if (startM < 510 || startM > 1110) startM = 510; // clamp to 8:30
      const endM = Math.min(startM + 120, 1170);

      document.getElementById("rangeStartTime").value = minutesToTimeStr(startM);
      document.getElementById("rangeEndTime").value = minutesToTimeStr(endM);
      renderRangeDayButtons();
      calculateAndRenderFreeRange();
    }

    function calculateAndRenderFreeRange() {
      const startStr = document.getElementById("rangeStartTime").value || "08:30";
      const endStr = document.getElementById("rangeEndTime").value || "13:10";
      let startMin = timeStrToMinutes(startStr);
      let endMin = timeStrToMinutes(endStr);
      const resultsContainer = document.getElementById("rangeSortedResults");

      if (endMin <= startMin) {
        resultsContainer.innerHTML = `
          <div class="p-4 rounded-2xl bg-rose-50 text-rose-600 text-xs font-semibold text-center border border-rose-200">
            End Time must be later than Start Time.
          </div>
        `;
        return;
      }

      const totalWindowMinutes = endMin - startMin;
      const daySlots = DAY_MATRIX[selectedRangeDay];

      // Identify which slots overlap
      const overlappingCols = [];
      TIME_COLUMNS.forEach((col, idx) => {
        const overlapStart = Math.max(startMin, col.startMin);
        const overlapEnd = Math.min(endMin, col.endMin);
        const overlapMins = Math.max(0, overlapEnd - overlapStart);
        if (overlapMins > 0) {
          overlappingCols.push({
            col,
            slotCode: daySlots[idx],
            overlapStart,
            overlapEnd,
            overlapMins
          });
        }
      });

      const activeFriends = getActiveFriendsList();
      const friendEvaluations = activeFriends.map(friend => {
        const slotMap = getFriendSlotMap(friend);
        let busyMinutes = 0;
        const busyConflicts = [];
        const freeSlotsInWindow = [];

        for (const item of overlappingCols) {
          const course = slotMap[item.slotCode];
          if (course) {
            busyMinutes += item.overlapMins;
            busyConflicts.push({
              slotCode: item.slotCode,
              course,
              slotStartStr: item.col.start,
              slotEndStr: item.col.end,
              overlapMins: item.overlapMins
            });
          } else {
            freeSlotsInWindow.push({
              slotCode: item.slotCode,
              slotStartStr: item.col.start,
              slotEndStr: item.col.end
            });
          }
        }

        const freeMinutes = Math.max(0, totalWindowMinutes - busyMinutes);
        const freePercent = Math.round((freeMinutes / totalWindowMinutes) * 100);

        return {
          friend,
          freeMinutes,
          busyMinutes,
          freePercent,
          busyConflicts,
          freeSlotsInWindow
        };
      });

      friendEvaluations.sort((a, b) => b.freeMinutes - a.freeMinutes);

      resultsContainer.innerHTML = `
        <div class="text-[11px] font-bold text-slate-400 uppercase tracking-wider px-1">
          Availability Rankings (${selectedRangeDay} • ${startStr} to ${endStr})
        </div>
        ${friendEvaluations.map((item, idx) => `
          <div class="bg-white border border-slate-200 rounded-2xl p-3.5 shadow-2xs space-y-2.5">
            <div class="flex items-center justify-between">
              <div>
                <div class="font-bold text-slate-900 text-sm flex items-center gap-1.5">
                  <span>#${idx + 1}</span>
                  <span>${item.friend.name}</span>
                </div>
                <div class="text-[11px] text-slate-500 font-mono">
                  Free: <strong class="text-brandBlue">${formatDuration(item.freeMinutes)}</strong> of ${formatDuration(totalWindowMinutes)}
                </div>
              </div>
              <span class="px-2.5 py-1 rounded-full text-xs font-bold font-mono ${item.freePercent === 100 ? 'bg-emerald-100 text-emerald-800' : (item.freePercent > 0 ? 'bg-amber-100 text-amber-800' : 'bg-rose-100 text-rose-800')
        }">
                ${item.freePercent}% Free
              </span>
            </div>

            <!-- Progress Bar -->
            <div class="w-full h-2 rounded-full bg-slate-100 overflow-hidden">
              <div class="h-full bg-brandBlue transition-all duration-300" style="width: ${item.freePercent}%"></div>
            </div>

            <!-- Details -->
            ${item.busyConflicts.length > 0 ? `
              <div class="pt-2 border-t border-slate-100 text-[11px] text-slate-500 space-y-1">
                <span class="font-bold text-slate-600">Conflicts in window:</span>
                ${item.busyConflicts.map(c => `
                  <div class="flex items-center justify-between bg-slate-50 px-2 py-1 rounded-lg">
                    <span><strong class="font-mono text-rose-600">${c.slotCode}</strong> (${c.course.code})</span>
                    <span class="font-mono font-semibold text-amber-700">${c.course.venue}</span>
                  </div>
                `).join("")}
              </div>
            ` : `
              <div class="text-[11px] text-emerald-700 font-medium">
                <i class="fa-solid fa-check mr-1"></i>No class conflicts in this time window!
              </div>
            `}
          </div>
        `).join("")}
      `;
    }

    /**
     * ========================================================================
     * 9. TAB 3: INDIVIDUAL TIMETABLE & REGISTERED COURSES (NO STATUS ROW)
     * ========================================================================
     */
    function renderIndividualView() {
      const friend = FRIENDS_DATA.find(f => f.id === selectedIndividualFriendId) || FRIENDS_DATA[0];
      const slotMap = getFriendSlotMap(friend);

      // Render Friend Selector Buttons
      const selectorContainer = document.getElementById("individualFriendSelector");
      selectorContainer.innerHTML = FRIENDS_DATA.map(f => {
        const isSelected = f.id === friend.id;
        return `
          <button
            onclick="selectIndividualFriend('${f.id}')"
            class="px-3.5 py-1 rounded-full text-xs font-bold transition border ${isSelected
            ? 'bg-brandBlue text-white border-brandBlue shadow-2xs'
            : 'bg-slate-100 text-slate-600 border-slate-200 hover:bg-slate-200'
          }"
          >
            ${f.name.split(" ")[0]}
          </button>
        `;
      }).join("");

      // Stats 2x2 Grid
      const totalCourses = friend.courses.length;
      const totalCredits = friend.courses.reduce((sum, c) => sum + Number(c.credit || 0), 0);
      const registeredSlotCount = Object.keys(slotMap).length;
      const totalWeekSlots = 42;
      const freeSlotCount = totalWeekSlots - registeredSlotCount;

      document.getElementById("individualStatsRow").innerHTML = `
        <div class="bg-cardBlue border border-cardBlueBorder p-3 rounded-2xl text-center">
          <div class="text-[10px] font-semibold text-slate-500 uppercase tracking-wider">Courses &amp; Credits</div>
          <div class="text-lg font-black font-mono text-slate-900 mt-0.5">${totalCourses} • ${totalCredits.toFixed(1)} Cr</div>
        </div>
        <div class="bg-cardPink border border-cardPinkBorder p-3 rounded-2xl text-center">
          <div class="text-[10px] font-semibold text-slate-500 uppercase tracking-wider">Weekly Busy</div>
          <div class="text-lg font-black font-mono text-slate-900 mt-0.5">${registeredSlotCount} / 42 Slots</div>
        </div>
      `;

      document.getElementById("individualCourseCountBadge").textContent = `${totalCourses} Courses`;

      // Render Registered Courses List - Clean mobile card items WITHOUT status row!
      const cardsFeed = document.getElementById("individualCourseCardsFeed");
      cardsFeed.innerHTML = friend.courses.map((c, i) => `
        <div class="p-3 bg-white hover:bg-slate-50 transition rounded-xl space-y-1.5">
          <div class="flex items-start justify-between gap-2">
            <div>
              <div class="flex items-center gap-1.5 flex-wrap">
                <span class="font-mono font-bold text-xs px-2 py-0.5 rounded-md bg-blue-50 text-brandBlue">
                  ${c.code}
                </span>
                <span class="font-mono text-[10px] font-bold px-1.5 py-0.5 rounded bg-slate-100 text-slate-600">
                  ${c.shortType}
                </span>
                <span class="font-mono text-[10px] font-bold px-1.5 py-0.5 rounded bg-slate-100 text-slate-600">
                  ${c.credit} Cr
                </span>
              </div>
              <h4 class="text-xs font-bold text-slate-900 mt-1">
                ${c.title}
              </h4>
            </div>
            <div class="text-right shrink-0">
              <span class="font-mono font-extrabold text-xs px-2 py-1 rounded-lg bg-amber-100 text-amber-800">
                ${c.venue}
              </span>
            </div>
          </div>

          <div class="flex items-center justify-between text-[11px] text-slate-500 pt-1 border-t border-slate-100">
            <span class="truncate"><i class="fa-solid fa-user-tie text-slate-400 mr-1"></i>${c.faculty}</span>
            <span class="font-mono font-bold text-brandBlue shrink-0 ml-2">Slots: ${c.slots.join("+")}</span>
          </div>
        </div>
      `).join("");
    }

    function selectIndividualFriend(friendId) {
      selectedIndividualFriendId = friendId;
      renderIndividualView();
    }

    /**
     * ========================================================================
     * 10. SQUAD TOGGLE HELPERS
     * ========================================================================
     */
    function toggleFriendActive(friendId) {
      if (activeFriendIds.has(friendId)) {
        if (activeFriendIds.size === 1) return;
        activeFriendIds.delete(friendId);
      } else {
        activeFriendIds.add(friendId);
      }
      refreshAllViews();
    }

    function setAllFriendsActive(val) {
      if (val) {
        FRIENDS_DATA.forEach(f => activeFriendIds.add(f.id));
      }
      refreshAllViews();
    }

    function refreshAllViews() {
      updateTopSummaryMetrics();
      renderLiveStatusBanner();
      renderInlineSquadToggles();
      if (activeTab === "master") {
        renderMasterDayPills();
        renderMobileSlotCards();
      } else if (activeTab === "range") {
        renderRangeDayButtons();
        calculateAndRenderFreeRange();
      } else if (activeTab === "individual") {
        renderIndividualView();
      }
    }

    /**
     * ========================================================================
     * INITIALIZATION
     * ========================================================================
     */
    window.onload = function () {
      updateTopSummaryMetrics();
      renderLiveStatusBanner();
      switchTab("master");
      setInterval(renderLiveStatusBanner, 30000);
    };
  </script>
</body>

</html>
